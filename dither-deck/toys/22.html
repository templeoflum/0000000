<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>◐</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;overscroll-behavior:none;background:#0e0d12}
#app{height:100vh;height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px}
#scene{width:min(80vw,340px);aspect-ratio:1;background:#fff;border-radius:3px}
#rail{width:min(86vw,420px);height:auto;touch-action:none;cursor:pointer}
</style>
</head>
<body>
<div id="app">
  <canvas id="scene"></canvas>
  <svg id="rail" viewBox="0 0 420 56" aria-label="the knob">
    <line x1="30" y1="28" x2="390" y2="28" stroke="#26242f" stroke-width="2" stroke-linecap="round"/>
    <circle id="knob" cx="30" cy="28" r="13" fill="#0e0d12" stroke="#93a4c2" stroke-width="2"/>
    <circle id="knobcore" cx="30" cy="28" r="4" fill="#93a4c2"/>
  </svg>
</div>
<script>
/* ── S22 "SCREENS": two AM halftone dot screens tilted apart, then a third
     arrives and the classic press rosette closes. ink pinned at 0.45. ──

   THE MATHS. each screen is a real AM spot function evaluated as a continuous
   tone landscape: a Euclidean (round) dot with a Gaussian dot-gain profile
       spot(x,y) = exp(-r²/2σ²),  r = distance to nearest cell centre
   in cell units (cell = P px, σ = 0.24 cell). superposition is the density
   product L = L1·L2 (dot-on-dot peaks where both screens peak) — the standard
   model for screen moiré (Amidror, "The Theory of the Moiré Phenomenon"):
   two rulings of period P tilted Δθ apart beat with macro cell
       Λ = P / (2 sin(Δθ/2)).
   k sweeps Δθ linearly 0°→30°, screens held symmetric about 45° (the black
   printer's angle, least visible to the eye). at Δθ=30° the pair sits at
   30°/60°; then for k>0.72 a third screen at 90° fades in by density
   interpolation L·((1-w)+w·L3). the trio 30°/60°/90° has separations
   30°/30°/60° — the rotated twin of the classic CMY angle set 15°/45°/75°
   (also 30/30/60) — and closes into the clear-centered / dot-centered
   rosette every litho press prints. 45° and 90° are the rational angles
   (tan = 1, ∞), 30°/60° the irrational ones (tan = 1/√3): the mix is real.

   THE JOURNEY (named states):
     k=0.00  Δθ=0°    "the 45° dot"     — one clean midtone dot screen
     k=0.12  Δθ=3.6°  "the great rosette" — Λ≈540px: one giant flower
     k=0.25  Δθ=7.5°  "rosettes"        — Λ≈260px rosette lattice
     k=0.50  Δθ=15°   "argyle"          — Λ≈130px diamond mesh
     k=0.72  Δθ=21.6° "the cluster field" — fine clusters, rings waking
     k=0.86  w=0.5    "the rings form"  — hex rosettes crystallising
     k=1.00  w=1      "the press rosette" — the CMY rosette, closed

   CALIBRATIONS (measured offline in numpy, 200-step sweep, this exact math):
     ruling P = 17·DPR = 34 px (20 cells across the field). coarser rulings
     cut rotation flips ∝ contour density 1/P.
     σ = 0.24 cell. steeper dots (σ≤0.22) spike the histogram at the
     threshold bin (ink wandered to 0.49) and sharpen the w-fade flips
     (worst step 7.4%): dead end, documented in FINDINGS.md.
     ink: exact 45th-percentile threshold per frame, 2048-bin histogram
     (the Gaussian-product landscape is spiky near 0; 02's 513 bins let one
     bin carry >1% of the field, so the bin count was quadrupled).
     measured ink: [0.447, 0.453] across all 201 stops.
     measured worst flip per 1/200 k-step: 2.28% at k=0.135 (the great
     rosette's outer annulus rotating) — inside the 2.5% law.
     the Δθ sweep is linear in k (30°/unit): any map that hurries the sweep
     (quadratic) blew the flip law at the fine end (6.6% at k=0.68).

   DEVIATIONS. the third screen's fade is a density interpolation, not a
   physical plate change — a press bolts the yellow screen down at full
   strength; we let it arrive gradually so the metamorphosis pours instead
   of jumping. real dots have harder edges than Gaussians; σ=0.24 is the
   dot-gain profile that keeps both the histogram and the flip law honest.
   the Δθ=0 state shows L1² (both screens registered): dots are a hair
   squarer than a single screen's — that is honest dot-on-dot superposition.

   BOUNDARY WITH S07. S07 tilts two already-binary line rulings (1-bit
   gratings, OR'ed, duty 0.34, no ink law): band beats live there. S22
   superposes continuous-tone dot screens by density product and pins the
   ink: dot moiré and rosettes live here. no overlap in math or in look.

   DEAD ENDS (see toys/lab/22/FINDINGS.md): clipped-paraboloid spot (the
   zero plateau breaks percentile thresholding); elliptical-dot → line
   crossover at Δθ=30° (the moiré dissolves into dashes by e≈1.6 — the
   elongation hides the beat); sweeping Δθ to 45° (fine pepper, three
   look-alike states — the law of feel killed it).                              */
const scene=document.getElementById("scene");
const DPR=2;               /* fixed internal resolution — layout-independent */
let S=680;
scene.width=S;scene.height=S;
const ctx=scene.getContext("2d");
const img=ctx.createImageData(S,S);
const N=S*S;
const P=17*DPR;            /* screen ruling: 34 px, 20 cells across the field */
const SIG=0.24,SIG2=2*SIG*SIG;
const W0=0.72;             /* k where the third screen starts arriving */
/* Gaussian dot-gain table g(q)=exp(-q/SIG2), q=du²+dv² in cell units ∈[0,0.5] */
const GT=new Float32Array(1025);
for(let i=0;i<=1024;i++)GT[i]=Math.exp(-(i/2048)/SIG2);
const XC=new Float32Array(N),YC=new Float32Array(N);
for(let y=0;y<S;y++)for(let x=0;x<S;x++){XC[y*S+x]=x-S/2;YC[y*S+x]=y-S/2;}
/* screen 3 sits at 90° forever — its landscape is fixed; precompute at load */
const L3=new Float32Array(N);
(function(){
  const c=Math.cos(Math.PI/2)/P,s=Math.sin(Math.PI/2)/P;
  for(let i=0;i<N;i++){
    const u=XC[i]*c+YC[i]*s, v=-XC[i]*s+YC[i]*c;
    const du=u-Math.floor(u+0.5), dv=v-Math.floor(v+0.5);
    let g=((du*du+dv*dv)*2048)|0; if(g>1024)g=1024;
    L3[i]=GT[g];
  }
})();
const F=new Float32Array(N);
const hist=new Uint32Array(2049);
let k=0;
function apply(){
  const dth=30*k*Math.PI/180;          /* angle between screens 1 and 2 */
  const w=k<=W0?0:(k-W0)/(1-W0);       /* third screen weight */
  const a1=Math.PI/4+dth/2, a2=Math.PI/4-dth/2;
  const c1=Math.cos(a1)/P, s1=Math.sin(a1)/P;
  const c2=Math.cos(a2)/P, s2=Math.sin(a2)/P;
  for(let i=0;i<N;i++){
    const px=XC[i],py=YC[i];
    let u=px*c1+py*s1, v=-px*s1+py*c1;
    let du=u-Math.floor(u+0.5), dv=v-Math.floor(v+0.5);
    let g=((du*du+dv*dv)*2048)|0; if(g>1024)g=1024;
    const l1=GT[g];
    u=px*c2+py*s2; v=-px*s2+py*c2;
    du=u-Math.floor(u+0.5); dv=v-Math.floor(v+0.5);
    g=((du*du+dv*dv)*2048)|0; if(g>1024)g=1024;
    let L=l1*GT[g];
    if(w>0)L*=(1-w)+w*L3[i];
    F[i]=L;
  }
  /* pin the quantity: threshold at the exact 45th percentile of the landscape */
  hist.fill(0);
  for(let i=0;i<N;i++){let q=(F[i]*2048)|0;if(q<0)q=0;if(q>2048)q=2048;hist[q]++;}
  const target=N*0.45;let acc=0,thr=0;
  for(let q=2048;q>=0;q--){acc+=hist[q];if(acc>=target){thr=(q-0.5)/2048;break;}}
  const d=img.data;let black=0;
  for(let i=0;i<N;i++){
    const on=F[i]>=thr;if(on)black++;
    const v=on?0:255,j=i*4;
    d[j]=v;d[j+1]=v;d[j+2]=v;d[j+3]=255;
  }
  ctx.putImageData(img,0,0);
  const cov=black/N;
  const lambda=dth>0?P/(2*Math.sin(dth/2)):Infinity;   /* moiré cell, px */
}
apply();
 
const rail=document.getElementById("rail");
const knob=document.getElementById("knob");
const knobcore=document.getElementById("knobcore");
let dragging=false;
function set(clientX){
  const r=rail.getBoundingClientRect();
  k=Math.min(1,Math.max(0,(clientX-r.left-r.width*30/420)/(r.width*360/420)));
  apply();
  const x=30+360*k;
  knob.setAttribute("cx",x); knobcore.setAttribute("cx",x);
}
function start(e){dragging=true;move(e);}
function move(e){
  if(!dragging)return;
  set(e.touches?e.touches[0].clientX:e.clientX);
  if(e.cancelable)e.preventDefault();
}
rail.addEventListener("mousedown",start);
rail.addEventListener("touchstart",start,{passive:false});
window.addEventListener("mousemove",move);
window.addEventListener("touchmove",move,{passive:false});
window.addEventListener("mouseup",()=>dragging=false);
window.addEventListener("touchend",()=>dragging=false);
document.addEventListener("touchmove",e=>{if(dragging)e.preventDefault();},{passive:false});
 
(function(){
  const rail=document.getElementById("rail");
  function n2c(t){const r=rail.getBoundingClientRect();return r.left+r.width*(30+360*Math.min(1,Math.max(0,t)))/420;}
  window.atom={name:"S22",
    set:function(t){set(n2c(t));},
    get:function(){const x=parseFloat(document.getElementById("knob").getAttribute("cx"));return (x-30)/360;}};
  const q=new URLSearchParams(location.search).get("k");
  if(q!==null) setTimeout(function(){window.atom.set(parseFloat(q));},80);
  window.addEventListener("message",function(e){if(e.data&&typeof e.data.atomSet==="number")window.atom.set(e.data.atomSet);});
  let lx=null;
  setInterval(function(){
    const x=parseFloat(document.getElementById("knob").getAttribute("cx"));
    if(x!==lx){lx=x;try{if(parent!==window)parent.postMessage({atomChange:{name:window.atom.name,k:(x-30)/360}},"*");}catch(err){}}
  },150);
})();
</script>
</body>
</html>
