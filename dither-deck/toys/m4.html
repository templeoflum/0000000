


<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>◐</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;overscroll-behavior:none;background:#0e0d12}
#app{height:100vh;height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px}
#scene{width:min(80vw,340px);aspect-ratio:1;background:#fff;border-radius:3px}
#rail{width:min(86vw,420px);height:auto;touch-action:none;cursor:pointer}
</style>
</head>
<body>
<div id="app">
  <canvas id="scene"></canvas>
  <svg id="rail" viewBox="0 0 420 56" aria-label="the knob">
    <line x1="30" y1="28" x2="390" y2="28" stroke="#26242f" stroke-width="2" stroke-linecap="round"/>
    <circle id="knob" cx="30" cy="28" r="13" fill="#0e0d12" stroke="#93a4c2" stroke-width="2"/>
    <circle id="knobcore" cx="30" cy="28" r="4" fill="#93a4c2"/>
  </svg>
</div>
<script>
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const frac=v=>v-Math.floor(v);
function hash2(ix,iy,seed){let h=(ix*374761393+iy*668265263+seed*1442695040)|0;h=(h^(h>>>13))|0;h=Math.imul(h,1274126177);h=(h^(h>>>16))>>>0;return h/4294967296;}
function vnoise(x,y,scale,seed){
  const gx=x/scale,gy=y/scale,ix=Math.floor(gx),iy=Math.floor(gy),fx=gx-ix,fy=gy-iy;
  const sx=fx*fx*(3-2*fx),sy=fy*fy*(3-2*fy);
  return (hash2(ix,iy,seed)*(1-sx)+hash2(ix+1,iy,seed)*sx)*(1-sy)
        +(hash2(ix,iy+1,seed)*(1-sx)+hash2(ix+1,iy+1,seed)*sx)*sy;
}
 
const scene=document.getElementById("scene");
let S=680;
(function(){
  const dpr=window.devicePixelRatio||1;
  const w=scene.getBoundingClientRect().width;
  if(w>50){ S=Math.max(256,Math.min(1024,Math.round(w*dpr))); scene.style.width=(S/dpr)+"px"; }
})();
scene.width=S;scene.height=S;
const RS=S/340;               // device-scale factor relative to reference layout
const ctx=scene.getContext("2d");
let k=0;
 
/* bond of studies 06 and 05: the strokes are fully combed to the hidden form;
   the knob is only the rising floor. thin strokes die first. */
const STROKES=[];
const R=S*0.36, CX=S*0.5, CY=S*0.47, LEN=8.5*RS;
let TOTALW=0;
(function(){
  const step=8.5*RS;
  let n=0;
  for(let y=step/2;y<S;y+=step)for(let x=step/2;x<S;x+=step){
    const jx=(hash2(n,1,3)-0.5)*step*0.9, jy=(hash2(n,2,7)-0.5)*step*0.9;
    const px=x+jx, py=y+jy;
    const ra=hash2(n,3,13)*Math.PI;
    const dx=px-CX, dy=py-CY, rho=Math.sqrt(dx*dx+dy*dy);
    const a=rho<R?Math.atan2(dy,dx)+Math.PI/2:ra;
    const w=(0.5+1.9*hash2(n,5,31))*RS;
    STROKES.push({x:px,y:py,a:a,w:w});
    TOTALW+=w;n++;
  }
})();
const WMAX=2.4*RS;
const NTOT=STROKES.length;
function apply(){
  /* v2: the ink is CONSERVED — when the floor takes a stroke, the survivors
     thicken to spend its share. the drawing coarsens in place: many-fine
     becomes few-bold, and the form must survive the translation. */
  const sig=k*WMAX*0.92;
  let aliveW=0,aliveN=0;
  for(const s of STROKES)if(s.w>sig){aliveW+=s.w;aliveN++;}
  const sc=aliveW>0?Math.min(3.4,TOTALW/aliveW):1;
  ctx.fillStyle="#fff";ctx.fillRect(0,0,S,S);
  ctx.strokeStyle="#000";ctx.lineCap="round";
  for(const s of STROKES){
    if(s.w<=sig)continue;
    ctx.lineWidth=s.w*sc;
    const c=Math.cos(s.a)*LEN/2, sn=Math.sin(s.a)*LEN/2;
    ctx.beginPath();ctx.moveTo(s.x-c,s.y-sn);ctx.lineTo(s.x+c,s.y+sn);ctx.stroke();
  }
  /* the steady voice is the conserved ink; the fifth thins with the count */
  const inkHeld=Math.min(1,(aliveW*sc)/TOTALW);
}
 
apply();
 
const rail=document.getElementById("rail");
const knob=document.getElementById("knob");
const knobcore=document.getElementById("knobcore");
let dragging=false;
function set(clientX){
  const r=rail.getBoundingClientRect();
  k=Math.min(1,Math.max(0,(clientX-r.left-r.width*30/420)/(r.width*360/420)));
  apply();
  const x=30+360*k;
  knob.setAttribute("cx",x); knobcore.setAttribute("cx",x);
}
function start(e){dragging=true;move(e);}
function move(e){
  if(!dragging)return;
  set(e.touches?e.touches[0].clientX:e.clientX);
  if(e.cancelable)e.preventDefault();
}
rail.addEventListener("mousedown",start);
rail.addEventListener("touchstart",start,{passive:false});
window.addEventListener("mousemove",move);
window.addEventListener("touchmove",move,{passive:false});
window.addEventListener("mouseup",()=>dragging=false);
window.addEventListener("touchend",()=>dragging=false);
document.addEventListener("touchmove",e=>{if(dragging)e.preventDefault();},{passive:false});
 
(function(){
  const rail=document.getElementById("rail");
  function n2c(t){const r=rail.getBoundingClientRect();return r.left+r.width*(30+360*Math.min(1,Math.max(0,t)))/420;}
  window.atom={name:"M4",
    set:function(t){set(n2c(t));},
    get:function(){const x=parseFloat(document.getElementById("knob").getAttribute("cx"));return (x-30)/360;}};
  const q=new URLSearchParams(location.search).get("k");
  if(q!==null) setTimeout(function(){window.atom.set(parseFloat(q));},80);
  window.addEventListener("message",function(e){if(e.data&&typeof e.data.atomSet==="number")window.atom.set(e.data.atomSet);});
  let lx=null;
  setInterval(function(){
    const x=parseFloat(document.getElementById("knob").getAttribute("cx"));
    if(x!==lx){lx=x;try{if(parent!==window)parent.postMessage({atomChange:{name:window.atom.name,k:(x-30)/360}},"*");}catch(err){}}
  },150);
})();
</script>
</body>
</html>
