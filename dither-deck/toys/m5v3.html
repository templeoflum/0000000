function hash2(ix,iy,seed){let h=(ix*374761393+iy*668265263+seed*1442695040)|0;h=(h^(h>>>13))|0;h=Math.imul(h,1274126177);h=(h^(h>>>16))>>>0;return h/4294967296;}
function vnoise(x,y,scale,seed){
  const gx=x/scale,gy=y/scale,ix=Math.floor(gx),iy=Math.floor(gy),fx=gx-ix,fy=gy-iy;
  const sx=fx*fx*(3-2*fx),sy=fy*fy*(3-2*fy);
  return (hash2(ix,iy,seed)*(1-sx)+hash2(ix+1,iy,seed)*sx)*(1-sy)
        +(hash2(ix,iy+1,seed)*(1-sx)+hash2(ix+1,iy+1,seed)*sx)*sy;
}
const scene=document.getElementById("scene");
const DPR=2;               /* fixed internal resolution — layout-independent */
let S=680;
scene.width=S;scene.height=S;
const ctx=scene.getContext("2d");
const img=ctx.createImageData(S,S);
const N=S*S;
const frac=v=>v-Math.floor(v);
/* four waypoint landscapes, precomputed */
const FA=new Float32Array(N),FB=new Float32Array(N),FC=new Float32Array(N),FD=new Float32Array(N);
(function(){
  const c45=Math.cos(Math.PI/4),s45=Math.sin(Math.PI/4);
  const cellB=9*DPR,cellC=15*DPR,cellD=8*DPR,wscale=42*DPR;
  for(let y=0;y<S;y++)for(let x=0;x<S;x++){
    const i=y*S+x;
    FA[i]=BN[(((y/(2*DPR))|0)%BN_N)*BN_N+(((x/(2*DPR))|0)%BN_N)];
    const u=(x*c45+y*s45)/cellB;
    FB[i]=Math.abs(frac(u)-0.5)*2;
    const uc=(x*c45+y*s45)/cellC, vc=(-x*s45+y*c45)/cellC;
    FC[i]=0.5-0.25*(Math.cos(2*Math.PI*uc)+Math.cos(2*Math.PI*vc));
    const wx=x+wscale*0.55*(vnoise(x,y,wscale,11)-0.5)*2;
    FD[i]=Math.abs(frac(wx/cellD)-0.5)*2;
  }
})();
const FINE=new Float32Array(N);
for(let y=0;y<S;y++)for(let x=0;x<S;x++)FINE[y*S+x]=BN[(y%BN_N)*BN_N+(x%BN_N)];
const F=new Float32Array(N);
const hist=new Uint32Array(513);
let k=0;
function apply(){
  /* traverse A→B→C→D, each crossing routed through the melt */
  let a,b,t;
  if(k<1/3){a=FA;b=FB;t=k*3;}
  else if(k<2/3){a=FB;b=FC;t=(k-1/3)*3;}
  else{a=FC;b=FD;t=(k-2/3)*3;}
  const tt=t*t*(3-2*t);
  const melt=Math.sin(Math.PI*t);      /* fusion is the doorway between families */
  const keep=1-melt;
  for(let i=0;i<N;i++)F[i]=(a[i]*(1-tt)+b[i]*tt)*keep+FINE[i]*melt;
  /* pin the quantity: threshold at the exact 45th percentile of the landscape */
  hist.fill(0);
  for(let i=0;i<N;i++){let q=(F[i]*512)|0;if(q<0)q=0;if(q>512)q=512;hist[q]++;}
  const target=N*0.45;let acc=0,thr=0.5;
  for(let q=0;q<=512;q++){acc+=hist[q];if(acc>=target){thr=(q+0.5)/512;break;}}
  const d=img.data;let black=0;
  for(let i=0;i<N;i++){
    const on=F[i]<thr;if(on)black++;
    const v=on?0:255,j=i*4;
    d[j]=v;d[j+1]=v;d[j+2]=v;d[j+3]=255;
  }
  ctx.putImageData(img,0,0);
  /* voice: pitch and level are functions of the measured quantity — which never moves.
     only the colour (filter) follows the arrangement's coarseness. */
  const cov=black/N;
  const blk=24*DPR;let m=0,m2=0,nb=0;
  for(let by=0;by+blk<=S;by+=blk)for(let bx=0;bx+blk<=S;bx+=blk){
    let s2=0;
    for(let y=by;y<by+blk;y+=4)for(let x=bx;x<bx+blk;x+=4)s2+=d[(y*S+x)*4]?0:1;
    const mm=s2/((blk/4)*(blk/4));m+=mm;m2+=mm*mm;nb++;
  }
  const varr=m2/nb-(m/nb)*(m/nb);
}
apply();
 
const rail=document.getElementById("rail");
const knob=document.getElementById("knob");
const knobcore=document.getElementById("knobcore");
let dragging=false;
function set(clientX){
  const r=rail.getBoundingClientRect();
  k=Math.min(1,Math.max(0,(clientX-r.left-r.width*30/420)/(r.width*360/420)));
  apply();
  const x=30+360*k;
  knob.setAttribute("cx",x); knobcore.setAttribute("cx",x);
}
function start(e){dragging=true;move(e);}
function move(e){
  if(!dragging)return;
  set(e.touches?e.touches[0].clientX:e.clientX);
  if(e.cancelable)e.preventDefault();
}
rail.addEventListener("mousedown",start);
rail.addEventListener("touchstart",start,{passive:false});
window.addEventListener("mousemove",move);
window.addEventListener("touchmove",move,{passive:false});
window.addEventListener("mouseup",()=>dragging=false);
window.addEventListener("touchend",()=>dragging=false);
document.addEventListener("touchmove",e=>{if(dragging)e.preventDefault();},{passive:false});
 
(function(){
  const rail=document.getElementById("rail");
  function n2c(t){const r=rail.getBoundingClientRect();return r.left+r.width*(30+360*Math.min(1,Math.max(0,t)))/420;}
  window.atom={name:"M5",
    set:function(t){set(n2c(t));},
    get:function(){const x=parseFloat(document.getElementById("knob").getAttribute("cx"));return (x-30)/360;}};
  const q=new URLSearchParams(location.search).get("k");
  if(q!==null) setTimeout(function(){window.atom.set(parseFloat(q));},80);
  window.addEventListener("message",function(e){if(e.data&&typeof e.data.atomSet==="number")window.atom.set(e.data.atomSet);});
  let lx=null;
  setInterval(function(){
    const x=parseFloat(document.getElementById("knob").getAttribute("cx"));
    if(x!==lx){lx=x;try{if(parent!==window)parent.postMessage({atomChange:{name:window.atom.name,k:(x-30)/360}},"*");}catch(err){}}
  },150);
})();
