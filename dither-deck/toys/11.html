/* ── THE TOY: the press dot, subdividing in place.
   the classical AM halftone: a 45° diamond lattice of round dots, one per
   cell, each holding its cell's ink at 0.45 exactly (r = d·√(0.45/2π) — dot
   area is tone by construction, in every cell, at every ruling). the knob
   walks the ruling down 136 → 68 → 34 → 17: a parent diamond splits into
   four children whose dots carry exactly its ink (4·π(r/2)² = πr² — nothing
   moves, nothing breathes). subdivision is in place and local: between stops,
   parent cells refine one by one in blue-noise order (08's law of regime
   change), so mid-travel the field is a patchwork of two rulings, each cell
   still exactly its own tone. dots never touch (0.45 keeps r under the
   diamond's inradius) — the grid stays honest AM all the way down.
   static states; the knob alone moves anything. ── */

const scene=document.getElementById("scene");
const DPR=2;               /* fixed internal resolution — layout-independent */
let S=680;
scene.width=S;scene.height=S;
const ctx=scene.getContext("2d");
const img=ctx.createImageData(S,S);
let k=0;
const TONE=0.45;
const DS=[136,68,34,17];           /* the ruling ladder — 680 subdivides exactly */

/* dot test at ruling d: 45° diamond lattice, torus-wrapped. per ruling the
   RADIUS and the screen PHASE are calibrated on one d×d tile so the discrete
   pixel count is the nearest whole-pixel truth to the tone — the RIP's own
   job: continuous dot area never survives the raster untouched, and at the
   finest ruling the lattice cannot even count 0.45 until its phase shifts. */
function makeLevel(d){
  function dotAt(x,y,rr,ox,oy){
    const xx=x+ox, yy=y+oy;
    const u0=Math.floor((xx+yy)/d), v0=Math.floor((yy-xx)/d);
    const cx=(u0-v0)/2*d, cy=(u0+v0+1)/2*d;
    let dx=xx-cx, dy=yy-cy;
    if(dx> S/2)dx-=S; if(dx<-S/2)dx+=S;
    if(dy> S/2)dy-=S; if(dy<-S/2)dy+=S;
    return (dx*dx+dy*dy<rr*rr)?1:0;
  }
  const r0=d*Math.sqrt(TONE/(2*Math.PI));
  const PH=[0,0.25,0.5,0.75];
  let bestR=r0, bestE=1, bestOx=0, bestOy=0;
  for(let pi=0;pi<4;pi++)for(let pj=0;pj<4;pj++){
    const ox=PH[pi], oy=PH[pj];
    let lo=r0*0.5, hi=r0*1.5;
    for(let it=0;it<14;it++){
      const mid=(lo+hi)/2;
      let n=0;
      for(let y=0;y<d;y++)for(let x=0;x<d;x++) n+=dotAt(x,y,mid,ox,oy);
      const tone=n/(d*d), e=Math.abs(tone-TONE);
      if(e<bestE){bestE=e;bestR=mid;bestOx=ox;bestOy=oy;}
      if(tone<TONE) lo=mid; else hi=mid;
    }
  }
  const out=new Uint8Array(S*S);
  for(let y=0;y<S;y++)for(let x=0;x<S;x++) out[y*S+x]=dotAt(x,y,bestR,bestOx,bestOy);
  return out;
}
const LEV=DS.map(makeLevel);
const NL=LEV.length;

/* per-parent-cell refinement mask: parent cells of ruling d, BN-ordered */
function parentField(d){
  /* map each pixel to its parent-cell index at ruling d, for BN lookup */
  const pf=new Float32Array(S*S);
  const seen={};
  for(let y=0;y<S;y++)for(let x=0;x<S;x++){
    const u0=Math.floor((x+y)/d), v0=Math.floor((y-x)/d);
    const key=u0*4096+v0;
    let b=seen[key];
    if(b===undefined){
      const cx=Math.abs(((u0-v0)/2*d)%S)|0, cy=Math.abs(((u0+v0+1)/2*d)%S)|0;
      b=BN[(cy%BN_N)*BN_N+(cx%BN_N)]; seen[key]=b;
    }
    pf[y*S+x]=b;
  }
  return pf;
}
const PAR=DS.slice(0,NL-1).map(parentField);

(function(){const d=img.data;for(let i=0;i<S*S;i++){const j=i*4;d[j+3]=255;}})();
function apply(){
  const p=k*(NL-1);
  let L=Math.floor(p), f=p-L;
  if(L>=NL-1){L=NL-1;f=0;}
  const A=LEV[L], B=f>0?LEV[L+1]:A, PF=f>0?PAR[L]:null;
  const d=img.data;
  for(let i=0;i<S*S;i++){
    const on=(PF&&PF[i]<f)?B[i]:A[i];   /* parents refine one by one, BN order */
    const v=on?0:255, j=i*4;
    d[j]=v;d[j+1]=v;d[j+2]=v;
  }
  ctx.putImageData(img,0,0);
}
apply();

const rail=document.getElementById("rail");
const knob=document.getElementById("knob");
const knobcore=document.getElementById("knobcore");
let dragging=false;
function set(clientX){
  const r=rail.getBoundingClientRect();
  k=Math.min(1,Math.max(0,(clientX-r.left-r.width*30/420)/(r.width*360/420)));
  apply();
  const x=30+360*k;
  knob.setAttribute("cx",x); knobcore.setAttribute("cx",x);
}
function start(e){dragging=true;move(e);}
function move(e){
  if(!dragging)return;
  set(e.touches?e.touches[0].clientX:e.clientX);
  if(e.cancelable)e.preventDefault();
}
rail.addEventListener("mousedown",start);
rail.addEventListener("touchstart",start,{passive:false});
window.addEventListener("mousemove",move);
window.addEventListener("touchmove",move,{passive:false});
window.addEventListener("mouseup",()=>dragging=false);
window.addEventListener("touchend",()=>dragging=false);
document.addEventListener("touchmove",e=>{if(dragging)e.preventDefault();},{passive:false});

(function(){
  const rail=document.getElementById("rail");
  function n2c(t){const r=rail.getBoundingClientRect();return r.left+r.width*(30+360*Math.min(1,Math.max(0,t)))/420;}
  window.atom={name:"S11",
    set:function(t){set(n2c(t));},
    get:function(){const x=parseFloat(document.getElementById("knob").getAttribute("cx"));return (x-30)/360;}};
  const q=new URLSearchParams(location.search).get("k");
  if(q!==null) setTimeout(function(){window.atom.set(parseFloat(q));},80);
})();
</script>
