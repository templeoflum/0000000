function vnoise(x,y,scale,seed){
  const gx=x/scale,gy=y/scale,ix=Math.floor(gx),iy=Math.floor(gy),fx=gx-ix,fy=gy-iy;
  const sx=fx*fx*(3-2*fx),sy=fy*fy*(3-2*fy);

const scene=document.getElementById("scene");
const DPR=2;               /* fixed internal resolution — layout-independent */
let S=680;
scene.width=S;scene.height=S;
const ctx=scene.getContext("2d");
const img=ctx.createImageData(S,S);
const N=S*S;
const frac=v=>v-Math.floor(v);
/* four waypoint landscapes, precomputed */
const FA=new Float32Array(N),FB=new Float32Array(N),FC=new Float32Array(N),FD=new Float32Array(N);
(function(){
  const c45=Math.cos(Math.PI/4),s45=Math.sin(Math.PI/4);
  const cellB=9*DPR,cellC=15*DPR,cellD=8*DPR,wscale=42*DPR;
  for(let y=0;y<S;y++)for(let x=0;x<S;x++){
    const i=y*S+x;
    FA[i]=BN[(((y/(2*DPR))|0)%BN_N)*BN_N+(((x/(2*DPR))|0)%BN_N)];
    const u=(x*c45+y*s45)/cellB;
    FB[i]=Math.abs(frac(u)-0.5)*2;
    const uc=(x*c45+y*s45)/cellC, vc=(-x*s45+y*c45)/cellC;
    FC[i]=0.5-0.25*(Math.cos(2*Math.PI*uc)+Math.cos(2*Math.PI*vc));
    const wx=x+wscale*0.55*(vnoise(x,y,wscale,11)-0.5)*2;
    FD[i]=Math.abs(frac(wx/cellD)-0.5)*2;
  }
})();
/* ── M5 v7 (variation: the OTHER floor). v6 machine unchanged, but the shared noise
   floor is 08's mask, not 02's — same walk, different static grain under it.
   v6 header follows:
 the families melt at their scales. one operator, certified in 01:
   the anchored pyramid. each family's screen is sampled block-constant at its
   readable level (stipple 2, lines 3, lattice 3, maze 3 — block size vs
   feature period); finer levels SUBDIVIDE: each block forgets its parent by a
   decaying perturbation, and every pyramid bottoms out at level 0 — ONE noise
   floor shared under all four families. a fully melted family doesn't become
   "a" mist, it becomes THE mist, so the crossing never swaps: walk one
   pyramid down to the floor, walk the next one back up out of it. melting out
   and condensing in are the same walk, opposite directions — and each family
   dies exactly where its scale says it should: stipple at the first
   subdivision, the maze clinging to the last. ink pinned at the 45th
   percentile of every state. static states; the knob alone moves anything. ── */
let k=0;
const R_OF=[2,3,3,3];             /* readable level per family: stipple 4px, lines/lattice/maze 8px */
const SCREENS=[FA,FB,FC,FD];
const SIG=0.55;                   /* subdivision perturbation — children forget their parents */
const WL=[680,340,170,85];        /* blocks per side: 1,2,4,8 px — 680 subdivides exactly */
const NZ=new Float32Array(S*S);   /* the floor: one noise field shared under every family, */
for(let i=0;i<S;i++)for(let j=0;j<S;j++) NZ[i*S+j]=BN2[(i%BN_N)*BN_N+(j%BN_N)];  /* so full melt IS the mist and crossings never cut */
const PYR=SCREENS.map((SCR,fam)=>{
  const R=R_OF[fam], built=[];
  for(let L=R;L>=0;L--){
    const W=WL[L], bs=S/W, f=new Float32Array(W*W);
    if(L===R){

        f[by*W+bx]=SCR[cy*S+cx];

      for(let by=0;by<W;by++)for(let bx=0;bx<W;bx++){

const F=new Float32Array(N);
const hist=new Uint32Array(513);
function fieldAt(levels,lf){
  const lo=Math.max(0,Math.floor(lf)), hi=Math.min(levels.length-1,lo+1), fr=lf-lo;
  const A=levels[lo], Bf=levels[hi], bA=S/A.W, bB=S/Bf.W;
  for(let y=0;y<S;y++){
    const ya=(y/bA|0)*A.W, yb=(y/bB|0)*Bf.W;

function apply(){
  let fa,fb,t;

  else{fa=2;fb=3;t=(k-2/3)*3;}
  if(t<0.5){ fieldAt(PYR[fa], (R_OF[fa]+1)*(1-2*t)); }
  else     { fieldAt(PYR[fb], (R_OF[fb]+1)*(2*t-1)); }

  hist.fill(0);
  for(let i=0;i<N;i++){let q=(F[i]*512)|0;if(q<0)q=0;if(q>512)q=512;hist[q]++;}

apply();

const rail=document.getElementById("rail");
const knob=document.getElementById("knob");
const knobcore=document.getElementById("knobcore");
let dragging=false;
function set(clientX){
  const r=rail.getBoundingClientRect();

function move(e){
  if(!dragging)return;
  set(e.touches?e.touches[0].clientX:e.clientX);
  if(e.cancelable)e.preventDefault();
}
rail.addEventListener("mousedown",start);
rail.addEventListener("touchstart",start,{passive:false});
window.addEventListener("mousemove",move);
window.addEventListener("touchmove",move,{passive:false});
window.addEventListener("mouseup",()=>dragging=false);
window.addEventListener("touchend",()=>dragging=false);
document.addEventListener("touchmove",e=>{if(dragging)e.preventDefault();},{passive:false});
 
(function(){
  const rail=document.getElementById("rail");
  function n2c(t){const r=rail.getBoundingClientRect();return r.left+r.width*(30+360*Math.min(1,Math.max(0,t)))/420;}
  window.atom={name:"M5",
    set:function(t){set(n2c(t));},
    get:function(){const x=parseFloat(document.getElementById("knob").getAttribute("cx"));return (x-30)/360;}};
  const q=new URLSearchParams(location.search).get("k");
  if(q!==null) setTimeout(function(){window.atom.set(parseFloat(q));},80);
  window.addEventListener("message",function(e){if(e.data&&typeof e.data.atomSet==="number")window.atom.set(e.data.atomSet);});
  let lx=null;
  setInterval(function(){
    const x=parseFloat(document.getElementById("knob").getAttribute("cx"));
    if(x!==lx){lx=x;try{if(parent!==window)parent.postMessage({atomChange:{name:window.atom.name,k:(x-30)/360}},"*");}catch(err){}}
  },150);
})();
</script>
</body>
</html>
