/* ── THE TOY: the excitable medium.
   not Turing — the other reaction-diffusion family. the deck's coat (S13)
   is Gray–Scott; this machine is the Barkley model of an excitable medium
   (Barkley 1991, Physica D 49:61–70), the standard honest spiral-wave
   equations of cardiac tissue and the Belousov–Zhabotinsky reaction:
     ∂u = ∇²u + (1/ε)·u·(1−u)·(u − (v+b)/a)     (the excitation, the wave)
     ∂v = u − v                                  (the recovery, the memory)
   run honestly: a=0.75, b=0.02, ε=0.02 (Barkley's spiral regime), dt=0.1,
   explicit Euler, five-point Laplacian, periodic edges, 340² lattice.
   nothing drawn; every ring and curl is the integrated field.
   the knob travels six FROZEN states of the medium, each a real
   configuration of the equations, each cut at the deck's own law — the
   45th percentile of the landscape F=1−u — so ink holds at 0.45 while the
   anatomy reorganizes (the wavebands get fat where the recovery tail
   hovers near threshold; the speckle on the trailing edges is the honest
   near-threshold field, not noise):
     k=0.00 targets      one pacemaker (a point re-excited every 70 steps)
                         — concentric rings, the BZ reaction's postcard
     k=0.20 ripple       two pacemakers ±85 cells — interference, an owl
     k=0.40 pinwheel     one spiral (quarter-plane seed: u=1 left half,
                         v=½ bottom half — the classic broken wavefront)
     k=0.60 carousel     2×2 spiral lattice, alternating chirality
     k=0.80 fiddleheads  4×4 spiral lattice — sixteen small curls
     k=1.00 worms        the same lattice seeded into the meander-breakup
                         regime (a=0.9, b=0.1) and frozen mid-melt:
                         wave debris, cuneiform
   the states are 1-bit frames precomputed offline (~200k cell-updates
   each; an instant switch cannot integrate) and bitpacked like S13;
   between stops the field dissolves in 08's blue-noise order — a
   reaction front, never a jump. worst case 1.33% of the field per
   1/200 k-step (measured with the deck's own mask). static states;
   the knob alone moves anything.
   dead ends, honestly: noise-seeded self-sustaining spiral turbulence
   (scanned a=0.9…1.1, b=0.06…0.19, ε=0.02…0.08) always decayed on this
   lattice within ~2000 steps — the worms are a frozen TRANSIENT of
   breakup, declared; a meandering rosette (b=0.05…0.07) had no time to
   bloom its petals before the integration budget ran out. ── */

function unpack(s){
  const bin=atob(s),n=340*340,out=new Uint8Array(n);
  for(let i=0;i<n;i++) out[i]=(bin.charCodeAt(i>>3)>>(7-(i&7)))&1;
  return out;
}
const FR=FRAMES.map(unpack);
const NS=FR.length;

const scene=document.getElementById("scene");
const DPR=2;               /* fixed internal resolution — layout-independent */
let S=680;
scene.width=S;scene.height=S;
const ctx=scene.getContext("2d");
ctx.imageSmoothingEnabled=false;
const G2=340;
const cv=document.createElement("canvas"); cv.width=G2;cv.height=G2;
const cx2=cv.getContext("2d");
const img=cx2.createImageData(G2,G2);
let k=0;

function apply(){
  const p=k*(NS-1);
  let D=Math.floor(p); if(D>NS-2)D=NS-2;
  let f=p-D; if(f<0)f=0;
  const A=FR[D], B=FR[D+1], d=img.data;
  for(let y=0;y<G2;y++){
    const br=(y&(BN_N-1))*BN_N, o=y*G2;
    for(let x=0;x<G2;x++){
      const i=o+x, a=A[i];
      const on=a===B[i]?a:(BN[br+(x&(BN_N-1))]<f?B[i]:a);   /* 08's dissolve */
      const v=on?0:255, j=i*4;
      d[j]=v;d[j+1]=v;d[j+2]=v;d[j+3]=255;
    }
  }
  cx2.putImageData(img,0,0);
  ctx.drawImage(cv,0,0,G2,G2,0,0,S,S);   /* 2px grains — the deck's weave */
}
apply();
 
const rail=document.getElementById("rail");
const knob=document.getElementById("knob");
const knobcore=document.getElementById("knobcore");
let dragging=false;
function set(clientX){
  const r=rail.getBoundingClientRect();
  k=Math.min(1,Math.max(0,(clientX-r.left-r.width*30/420)/(r.width*360/420)));
  apply();
  const x=30+360*k;
  knob.setAttribute("cx",x); knobcore.setAttribute("cx",x);
}
function start(e){dragging=true;move(e);}
function move(e){
  if(!dragging)return;
  set(e.touches?e.touches[0].clientX:e.clientX);
  if(e.cancelable)e.preventDefault();
}
rail.addEventListener("mousedown",start);
rail.addEventListener("touchstart",start,{passive:false});
window.addEventListener("mousemove",move);
window.addEventListener("touchmove",move,{passive:false});
window.addEventListener("mouseup",()=>dragging=false);
window.addEventListener("touchend",()=>dragging=false);
document.addEventListener("touchmove",e=>{if(dragging)e.preventDefault();},{passive:false});
 
(function(){
  const rail=document.getElementById("rail");
  function n2c(t){const r=rail.getBoundingClientRect();return r.left+r.width*(30+360*Math.min(1,Math.max(0,t)))/420;}
  window.atom={name:"S16",
    set:function(t){set(n2c(t));},
    get:function(){const x=parseFloat(document.getElementById("knob").getAttribute("cx"));return (x-30)/360;}};
  const q=new URLSearchParams(location.search).get("k");
  if(q!==null) setTimeout(function(){window.atom.set(parseFloat(q));},80);
  window.addEventListener("message",function(e){if(e.data&&typeof e.data.atomSet==="number")window.atom.set(e.data.atomSet);});
  let lx=null;
  setInterval(function(){
    const x=parseFloat(document.getElementById("knob").getAttribute("cx"));
    if(x!==lx){lx=x;try{if(parent!==window)parent.postMessage({atomChange:{name:window.atom.name,k:(x-30)/360}},"*");}catch(err){}}
  },150);
})();
</script>
