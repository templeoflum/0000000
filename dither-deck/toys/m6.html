<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>◐</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;overscroll-behavior:none;background:#0e0d12}
#app{height:100vh;height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px}
#scene{width:min(80vw,340px);aspect-ratio:1;background:#fff;border-radius:3px}
#rail{width:min(86vw,420px);height:auto;touch-action:none;cursor:pointer}
</style>
</head>
<body>
<div id="app">
  <canvas id="scene"></canvas>
  <svg id="rail" viewBox="0 0 420 56" aria-label="the knob">
    <line x1="30" y1="28" x2="390" y2="28" stroke="#26242f" stroke-width="2" stroke-linecap="round"/>
    <circle id="knob" cx="30" cy="28" r="13" fill="#0e0d12" stroke="#93a4c2" stroke-width="2"/>
    <circle id="knobcore" cx="30" cy="28" r="4" fill="#93a4c2"/>
  </svg>
</div>
<script>
/* ── M6: bond of studies 07 and 02 — the screen clash.
   two copies of 02's cosine lattice, detuned SYMMETRICALLY about 02's base
   angle exactly as 07 detunes its rulings (±θ/2, θ running 0→45° on 07's
   k² curve). the summed field is thresholded at the 45th percentile of every
   state — 02's exact conservation, so the ink never moves, only the
   interference. k=0 the two screens are one: 02's lattice dwell. as θ grows
   the beat walks in — Λ = p/(2 sin(θ/2)), 07's law — soft fringes, then the
   rosette near 30° (the printer's angle: where two dot screens sit most
   quietly together), then full clash at 45°. no dissolve stages, no masks:
   one parametric family, recomputed per state. static states; the knob alone
   moves anything. ── */
const scene=document.getElementById("scene");
const DPR=2;               /* fixed internal resolution — layout-independent */
let S=680;
scene.width=S;scene.height=S;
const ctx=scene.getContext("2d");
const img=ctx.createImageData(S,S);
let k=0;
const CELL=15*DPR;           /* 02's lattice period */
const CX=S/2, CY=S/2;
const TAU=2*Math.PI;
const F=new Float32Array(S*S);
const hist=new Uint32Array(513);
function apply(){
  const th=45*k*k*Math.PI/180;            /* 07's detune curve */
  const base=Math.PI/4;                   /* 02's lattice base angle */
  const a1=base-th/2, a2=base+th/2;
  const c1=Math.cos(a1)/CELL, s1=Math.sin(a1)/CELL;
  const c2=Math.cos(a2)/CELL, s2=Math.sin(a2)/CELL;
  for(let y=0;y<S;y++){
    const dy=y-CY;
    /* row-start phases, then step along x */
    let u1=(-CX)*c1+dy*s1, v1=-(-CX)*s1+dy*c1;
    let u2=(-CX)*c2+dy*s2, v2=-(-CX)*s2+dy*c2;
    const o=y*S;
    for(let x=0;x<S;x++){
      const L1=0.5-0.25*(Math.cos(TAU*u1)+Math.cos(TAU*v1));
      const L2=0.5-0.25*(Math.cos(TAU*u2)+Math.cos(TAU*v2));
      F[o+x]=(L1+L2)*0.5;
      u1+=c1; v1+=-s1; u2+=c2; v2+=-s2;
    }
  }
  /* 02's conservation: 45th percentile, exact every state */
  hist.fill(0);
  const N=S*S;
  for(let i=0;i<N;i++){let q=(F[i]*512)|0;if(q<0)q=0;if(q>512)q=512;hist[q]++;}
  const target=N*0.45;let acc=0,thr=0.5;
  for(let q=0;q<=512;q++){acc+=hist[q];if(acc>=target){thr=(q+0.5)/512;break;}}
  const d=img.data;
  for(let i=0;i<N;i++){
    const v=F[i]<thr?0:255,j=i*4;
    d[j]=v;d[j+1]=v;d[j+2]=v;d[j+3]=255;
  }
  ctx.putImageData(img,0,0);
}
apply();

const rail=document.getElementById("rail");
const knob=document.getElementById("knob");
const knobcore=document.getElementById("knobcore");
let dragging=false;
function set(clientX){
  const r=rail.getBoundingClientRect();
  k=Math.min(1,Math.max(0,(clientX-r.left-r.width*30/420)/(r.width*360/420)));
  apply();
  const x=30+360*k;
  knob.setAttribute("cx",x); knobcore.setAttribute("cx",x);
}
function start(e){dragging=true;move(e);}
function move(e){
  if(!dragging)return;
  set(e.touches?e.touches[0].clientX:e.clientX);
  if(e.cancelable)e.preventDefault();
}
rail.addEventListener("mousedown",start);
rail.addEventListener("touchstart",start,{passive:false});
window.addEventListener("mousemove",move);
window.addEventListener("touchmove",move,{passive:false});
window.addEventListener("mouseup",()=>dragging=false);
window.addEventListener("touchend",()=>dragging=false);
document.addEventListener("touchmove",e=>{if(dragging)e.preventDefault();},{passive:false});

(function(){
  const rail=document.getElementById("rail");
  function n2c(t){const r=rail.getBoundingClientRect();return r.left+r.width*(30+360*Math.min(1,Math.max(0,t)))/420;}
  window.atom={name:"M6",
    set:function(t){set(n2c(t));},
    get:function(){const x=parseFloat(document.getElementById("knob").getAttribute("cx"));return (x-30)/360;}};
  const q=new URLSearchParams(location.search).get("k");
  if(q!==null) setTimeout(function(){window.atom.set(parseFloat(q));},80);
})();
</script>
</body>
</html>
