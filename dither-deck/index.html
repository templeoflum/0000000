<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;overscroll-behavior:none;background:#0e0d12}
#bar{position:fixed;top:0;left:0;right:0;z-index:2;display:flex;flex-direction:column;align-items:center;gap:9px;padding-top:16px}
.row{display:flex;gap:13px;height:14px;align-items:center}
.dot{width:13px;height:13px;border-radius:50%;background:#26242f;cursor:pointer;transition:background .15s}
.dot:hover{background:#4a4658}
.row.mol .dot{border-radius:3px}
.dot.on{background:#93a4c2}
#versrow{gap:7px;height:9px}

#versrow .dot.on{background:#c2a493}
#stage{height:100vh;height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px}
#view{width:min(80vw,340px);aspect-ratio:1;background:#fff;border-radius:3px}
#rail{width:min(86vw,420px);height:auto;touch-action:none;cursor:pointer}
#tag{position:fixed;right:16px;bottom:12px;color:#565064;font:11px/1 ui-monospace,Menlo,monospace;letter-spacing:2px}
</style>

/* ── THE TOY v2: the same half-ink CONDENSING in place — grains adopt their
   parent's value through a fixed-anchor block pyramid. no rescale, no camera. ── */
const BN_N=128;
const BN=(()=>{const b64=MASK_OLD;const bin=atob(b64),n=bin.length/2,t=new Float32Array(n);
  for(let i=0;i<n;i++){const v=bin.charCodeAt(2*i)|(bin.charCodeAt(2*i+1)<<8);t[i]=(v+0.5)/n;}return t;})();
const scene=document.createElement("canvas");
/* render 1:1 to TRUE device pixels — no resampling, no display moiré.
   fallback to 680 if layout hasn't happened (hidden preview safety). */
let S=680;
(function(){
  const dpr=window.devicePixelRatio||1;
  const w=scene.getBoundingClientRect().width;
  if(w>50){ S=Math.max(256,Math.min(1024,Math.round(w*dpr))); scene.style.width=(S/dpr)+"px"; }
})();
scene.width=S;scene.height=S;
const ctx=scene.getContext("2d");
const img=ctx.createImageData(S,S);
const LMAX=5;                                  // pyramid: block sizes 1,2,4,8,16,32
const LV=[];                                   // per-level threshold fields, spatially anchored
(function(){
  for(let L=0;L<=LMAX;L++){
    const B=Math.pow(2,L), f=new Float32Array(S*S);
    for(let y=0;y<S;y++){
      const my=((y/B)|0)%BN_N;
      for(let x=0;x<S;x++)f[y*S+x]=BN[my*BN_N+(((x/B)|0)%BN_N)];
    }
    LV.push(f);
  }
})();
const F=new Float32Array(S*S);
const hist=new Uint32Array(513);
let k=0;
function apply(){
  const lvl=(1-k)*LMAX;                        // left = coarse blobs, right = fine mist
  const L=Math.min(LMAX-1,Math.floor(lvl)), f=lvl-L;
  const A=LV[L], Bf=LV[L+1];
  const N=S*S;
  for(let i=0;i<N;i++)F[i]=A[i]*(1-f)+Bf[i]*f; // blend toward the coarser parent as k falls
  /* pin the ink at exactly half: per-frame median threshold */
  hist.fill(0);
  for(let i=0;i<N;i++){let q=(F[i]*512)|0;if(q<0)q=0;if(q>512)q=512;hist[q]++;}
  const target=N*0.5;let acc=0,thr=0.5;
  for(let q=0;q<=512;q++){acc+=hist[q];if(acc>=target){thr=(q+0.5)/512;break;}}
  const d=img.data;
  for(let i=0;i<N;i++){
    const v=F[i]<thr?0:255,j=i*4;
    d[j]=v;d[j+1]=v;d[j+2]=v;d[j+3]=255;
  }
  ctx.putImageData(img,0,0);
  /* voice: two tones detuned by coarseness; condensation to blobs = beating,
     dissolution to mist = fusion to unison */
  const det=(1-k);
}
apply();

}

const r2=document.createElement("div");r2.className="row mol";bar.appendChild(r2);
const rv=document.createElement("div");rv.id="versrow";rv.className="row";bar.appendChild(rv);
let litAtom=null, litMol=null, litVers=[];
function light(row,i){ if(row===1){litAtom=i;} else {litMol=i;}
  [...r1.children].forEach((d,j)=>d.classList.toggle("on",j===litAtom));
  [...r2.children].forEach((d,j)=>d.classList.toggle("on",j===litMol));
}
const ATOMS=[{label:"S01",m:REG[0]},{label:"S02",m:REG[1]},{label:"S03",m:REG[2]},{label:"S04",m:REG[3]},{label:"S05",m:REG[4]},{label:"S06",m:REG[5]},{label:"S07",m:REG[6]},{label:"S08",m:REG[7]},{label:"S09",m:REG[8]},{label:"S10",m:REG[9]},{label:"S11",m:REG[10]},{label:"S12",m:REG[11]},{label:"S13",m:REG[12]},{label:"S16",m:REG[13]},{label:"S20",m:REG[14]},{label:"S21",m:REG[15]},{label:"S22",m:REG[16]},{label:"S23",m:REG[17]}];
const MOLS=[{label:"M1",vers:[{m:REG[18],vt:"M1"}]},{label:"M2",vers:[{m:REG[19],vt:"M2"}]},{label:"M3",vers:[{m:REG[20],vt:"M3"}]},{label:"M4",vers:[{m:REG[21],vt:"v4"},{m:REG[22],vt:"v5"}]},{label:"M5",vers:[{m:REG[23],vt:"v7"},{m:REG[24],vt:"v6"}]},{label:"M6",vers:[{m:REG[25],vt:"M6"}]},{label:"M7",vers:[{m:REG[26],vt:"M7"}]},{label:"M8",vers:[{m:REG[27],vt:"M8"}]},{label:"M9",vers:[{m:REG[28],vt:"M9"}]}];

let curMol=-1, curVers=-1;
ATOMS.forEach((a,i)=>{
  const d=mkdot(()=>{ curMol=-1; light(1,i); rv.innerHTML=""; activate(a.m,a.label); });
  r1.appendChild(d);
});
MOLS.forEach((mo,i)=>{
  const d=mkdot(()=>{
    light(2,i);
    if(i!==curMol){ curMol=i; curVers=0; }
    rv.innerHTML=""; litVers=[];
    if(mo.vers.length>1){
      mo.vers.forEach((v,j)=>{
        const vd=mkdot(()=>{ curVers=j; activate(v.m, mo.label+" · "+v.vt);
          [...rv.children].forEach((x,q)=>x.classList.toggle("on",q===j)); });
        if(j===curVers) vd.classList.add("on");
        rv.appendChild(vd);
      });
    }
    const v=mo.vers[curVers];
    activate(v.m, mo.vers.length>1 ? mo.label+" · "+v.vt : mo.label);
  });
  r2.appendChild(d);
});
light(1,0);
activate(ATOMS[0].m, ATOMS[0].label);
</script>
</body>
</html>
