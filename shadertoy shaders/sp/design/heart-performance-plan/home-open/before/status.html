// FADER GESTURES — mouse hold visits a level; scrolling sets a lasting level.
function bindFaderGesture(d,trk,{getValue,setValue,onRelease,onState}){
  const lifecycle=new AbortController(), signal=lifecycle.signal;

  const eat=e=>{e.preventDefault();e.stopImmediatePropagation();};
  const state=()=>onState(mode,captured?'captured':pending?'capturing':'in-page');
  const dropShield=()=>{clearTimeout(shieldTimer);shield?.remove();shield=null;};
  function finish(reason='release'){
    if(!mode)return;
    const old=mode;mode=null;captured=pending=false;epoch++;clearTimeout(wheelTimer);
    if(document.pointerLockElement===trk || window.heartPointer?.pendingTarget===trk)document.exitPointerLock?.();
    state();onRelease(old,reason);
    // Consume the click generated by this mouseup before uncovering other controls.
    clearTimeout(shieldTimer);shieldTimer=setTimeout(dropShield,0);
  }
  function fallback(at){if(mode&&at===epoch){captured=pending=false;state();}}
  function begin(next,e){
    if(mode||shield || (document.pointerLockElement&&document.pointerLockElement!==trk) ||
      (window.heartPointer?.pendingTarget&&window.heartPointer.pendingTarget!==trk))return false;
    mode=next;epoch++;d.faderRevision=(d.faderRevision||0)+1;rect=trk.getBoundingClientRect();y=e.clientY;
    shield=document.createElement('div');
    Object.assign(shield.style,{position:'fixed',inset:'0',zIndex:'2147483647',cursor:next==='hold'?'ns-resize':'default',touchAction:'none'});
    shield.setAttribute('aria-hidden','true');document.body.appendChild(shield);
    pending=!!trk.requestPointerLock;state();
    const at=epoch;
    try{const p=trk.requestPointerLock?.();if(p?.catch)p.catch(()=>fallback(at));}catch(err){fallback(at);}
    return true;
  }
  const absolute=()=>setValue(Math.max(0,Math.min(1,1-(y-rect.top)/Math.max(1,rect.height))));
  function wheel(e){
    eat(e);if(mode==='hold')return;
    if(!mode&&!begin('scroll',e))return;
    const units=e.deltaMode===1?16:e.deltaMode===2?rect.height:1;
    setValue(Math.max(0,Math.min(1,getValue()-e.deltaY*units/260*(e.shiftKey?.1:1))));
    clearTimeout(wheelTimer);wheelTimer=setTimeout(()=>finish('scroll-end'),180);
  }
  trk.addEventListener('mousedown',e=>{if(e.button!==0)return;eat(e);if(begin('hold',e))absolute();},{signal});
  trk.addEventListener('wheel',wheel,{passive:false,signal});
  // This shield also provides a browser fallback when wheel events cannot request OS pointer lock.
  document.addEventListener('wheel',e=>{if(mode)wheel(e);else if(shield)eat(e);},{capture:true,passive:false,signal});
  document.addEventListener('mousemove',e=>{
    if(mode!=='hold')return;
    if(captured)y=Math.max(rect.top,Math.min(rect.top+rect.height,y+(e.movementY||0)));
    else{if(e.buttons===0){finish('release');return;}y=e.clientY;}
    absolute();eat(e);
  },{capture:true,signal});
  for(const type of ['pointerdown','mousedown','pointerup','mouseup','click','dblclick','auxclick','contextmenu','touchstart','touchmove','gesturestart','gesturechange'])
    document.addEventListener(type,e=>{
      if(!mode&&!shield)return;eat(e);
      if((type==='mouseup'||type==='pointerup')&&e.button===0&&mode==='hold')finish('release');
      else if(type==='contextmenu')finish('cancel');
    },{capture:true,passive:false,signal});
  document.addEventListener('pointercancel',()=>finish('cancel'),{signal});
  document.addEventListener('pointerlockchange',()=>{
    if(document.pointerLockElement===trk){if(!mode){document.exitPointerLock?.();return;}captured=true;pending=false;state();}
    else if(captured)finish('capture-lost');
  },{signal});
  document.addEventListener('pointerlockerror',()=>fallback(epoch),{signal});
  document.addEventListener('keydown',e=>{if(mode&&e.key==='Escape'){eat(e);finish('cancel');}},{capture:true,signal});
  window.addEventListener('blur',()=>finish('blur'),{signal});
  window.addEventListener('pagehide',()=>finish('hidden'),{signal});
  document.addEventListener('visibilitychange',()=>{if(document.hidden)finish('hidden');},{signal});
  return {active:()=>!!mode,dispose(){finish('removed');d.faderRevision=(d.faderRevision||0)+1;dropShield();lifecycle.abort();}};
}

    document.getElementById("padlanes").textContent=[1,2,3,4].map(n=>{const i=Object.keys(st.assign).find(k=>st.assign[k]===n); return i?`${n}:L${i}`:`${n}:–`;}).join("  "); }
  // ── settings popover ──
  function popover(i,d,ev){ document.querySelectorAll(".pop").forEach(p=>p.remove()); const c=cfgOf(i); const p=document.createElement("div"); p.className="pop";
    p.innerHTML=`<b>L${i} trackpad — touch / release</b>
     <div>Mouse: scroll keeps the level · hold releases to 0</div>
     <label>touch <select data-k="touch"><option value="abs">absolute</option><option value="rel">relative</option><option value="catch">catch</option></select></label>
     <label>release <select data-k="rel"><option value="hold">hold</option><option value="zero">spring → 0</option><option value="home">spring → home</option></select></label>
     <label>spring s <input type="range" data-k="spring" min="0" max="3" step="0.05"></label>
     <label>smooth <input type="range" data-k="smooth" min="0" max="0.95" step="0.05"></label>
     <label>rel gain <input type="range" data-k="gain" min="0.25" max="3" step="0.05"></label>
     <label>press = finer (pad) <input type="checkbox" data-k="pfine"></label>
     <button>Close</button>`;
    p.querySelectorAll("[data-k]").forEach(el=>{const k=el.dataset.k; if(el.type==="checkbox") el.checked=!!c[k]; else el.value=c[k];
      el.oninput=()=>{st.cfg[i]=st.cfg[i]||{}; st.cfg[i][k]=el.type==="checkbox"?el.checked:(isNaN(+el.value)?el.value:+el.value); save(); paintLanes();};});
  p.lastElementChild.onclick=()=>p.remove(); d.appendChild(p); ev.stopPropagation(); }
  // ── lock ──
  const ov=document.getElementById("padov"), btn=document.getElementById("padlock"), btnF=document.getElementById("figlock");
  let LMODE="lanes";
  // while locked, the browser must not interpret the fingers: no scroll, no pinch-zoom, no swipe-back, no gestures
  const EATS=["wheel","gesturestart","gesturechange","gestureend","touchstart","touchmove","touchend","contextmenu","mousedown","mouseup","dblclick","auxclick"];
  const eat=e=>{ e.preventDefault(); e.stopPropagation(); };
  const eatKey=e=>{ if(e.key!=="Escape"&&e.key!=="l"&&e.key!=="L"&&e.key!=="f"&&e.key!=="F"){ e.preventDefault(); e.stopPropagation(); } };
  const pill=Object.assign(document.body.appendChild(document.createElement("div")),{id:"lockpill",textContent:"⌗ PAD LOCKED — Esc",style:"position:fixed;top:8px;right:12px;background:#4fb8e8;color:#02040a;padding:4px 10px;border-radius:12px;font-weight:600;display:none;z-index:999"});
  function lock(mode){ if(mode==="fig")return; if(locked) return; LMODE=mode||"lanes"; locked=true; ov.classList.add("on"); (LMODE==="fig"?btnF:btn).classList.add("on"); pill.textContent=LMODE==="fig"?"⌗ VARIATIONS — tap: keep variation · hold: visit · release: return · Esc":"⌗ FADERS LOCKED — Esc"; pill.style.display="block"; document.documentElement.classList.add("padlocked");
    for(const t of EATS) document.addEventListener(t,eat,{passive:false,capture:true}); document.addEventListener("keydown",eatKey,{capture:true});
    PB.prev={}; PB.state={};                                 // fresh state machine on every grab
    try{if(!ov.requestPointerLock){unlock();return;} const p=ov.requestPointerLock();if(p?.catch)p.catch(unlock);}catch(e){unlock();return;} document.getElementById("figgrid").classList.toggle("live",LMODE==="fig");
    document.getElementById("padhint").textContent=LMODE==="fig"?"LOCKED — tap: keep variation · hold: visit · release: return · Esc":"LOCKED — Esc to release"; }
  function unlock(){ if(!locked) return; locked=false; ov.classList.remove("on"); btn.classList.remove("on"); btnF.classList.remove("on"); pill.style.display="none"; document.documentElement.classList.remove("padlocked");
    for(const t of EATS) document.removeEventListener(t,eat,{capture:true}); document.removeEventListener("keydown",eatKey,{capture:true}); if(document.pointerLockElement===ov) document.exitPointerLock?.(); document.getElementById("padhint").textContent="⌗ FADERS (L) → lanes · ⌗ VARIATIONS (F) → variation launcher · Esc releases"; for(const i in F) F[i].touch=null;
    const gg=document.getElementById("figgrid"); gg.classList.remove("live");
    for(const i in PB.state) pbRelease(+i,performance.now()/1000,false);   // release any lean, cancel any tap
    PB.prev={};
    gg.querySelectorAll(".fz").forEach(z=>{z.classList.remove("press","holdz"); z.querySelector(".fdot2").style.display="none";}); }
  btn.onclick=()=>locked?unlock():lock("lanes");
  btnF.onclick=()=>locked?unlock():lock("fig");
  document.addEventListener("keydown",e=>{ if(e.key==="Escape") unlock(); else if(e.target.tagName!=="INPUT"&&(e.key==="l"||e.key==="L")){ locked?unlock():lock("lanes"); } });
  document.addEventListener("pointerlockchange",()=>{ if(locked&&document.pointerLockElement!==ov) unlock(); });
  document.addEventListener("pointerlockerror",unlock);
  ov.addEventListener("click",e=>e.stopPropagation());   // clicks while locked do nothing (a tap on the pad must not steer the UI)
  // ── trackpad PAD-BANK mode: 2×3 preset pads on the focus clip (tap/hold per the pads study) ──
  // ── the FIGURE LAUNCHER: trackpad as 2×3 preset pads. tap = go · hold = lean (release = come back) ──
  const FT=()=>focusTarget();    // the figure, always
  const gEl=document.getElementById("figgrid");
  gEl.innerHTML=["Variation 1","Variation 2","Variation 3","Variation 4","Variation 5","Variation 6"].map((z,i)=>
    `<div class="fz" data-z="${i+1}"><span class="zl">${z}</span><span class="zp">hold: preset ${i+1}</span><span class="fdot2"></span></div>`).join("");
  const fz=i=>gEl.querySelector(`.fz[data-z="${i}"]`);
  let fArmed=false; const fArmB=document.getElementById("figarm");
  fArmB.onclick=()=>{fArmed=!fArmed; fArmB.classList.toggle("on",fArmed); gEl.classList.toggle("armed",fArmed);};
  document.getElementById("fighome").onclick=()=>cmd({cmd:"home",...FT()});
  const PB={prev:{}, state:{}};             // fingerId→pad, pad→{t0,held}
  function padOf(g){ return Math.min(1,Math.max(0,Math.floor((1-g.y)*2)))*3 + Math.min(2,Math.max(0,Math.floor(g.x*3))) + 1; }
  const ZCAT=["pattern","timing","motion","range","look","all"];   // the six zones: 5 shuffles + ALL
  function pbRelease(i,now,fire){ const st=PB.state[i]; if(!st) return;
    if(fire===undefined) fire=true;
    const cell=fz(i); cell.classList.remove("press","holdz"); cell.querySelector(".fdot2").style.display="none";
    if(!st.held){
      if(fire && st.target){                                            // a slide-out or unlock CANCELS instead of firing
        if(fArmed){ cmd({cmd:"preset_save",pad:i,name:document.getElementById("variation-name").value,...st.target}); fArmed=false; fArmB.classList.remove("on"); gEl.classList.remove("armed"); }
        else cmd({cmd:"preset_go",pad:i,...st.target});  // TAP → shuffle that category (percussion)
        cell.classList.add("flash"); setTimeout(()=>cell.classList.remove("flash"),260);
      }
    } else cmd({cmd:"preset_mom",pad:i,on:false,...st.target}); // release a HOLD → always come back
    delete PB.state[i]; }
  function pbFrame(s,now){
    const c=s.fingers.filter(g=>g.state!=="leave"&&g.state!=="hover"); const cur={};
    for(const g of c){ const i=padOf(g);                     // re-evaluate EVERY frame (ids are a recycled pool)
      const pi=PB.prev[g.id];
      if(pi!=null && pi!==i && !Object.values(cur).includes(pi)) pbRelease(pi,now,false);   // slid out: cancel
      cur[g.id]=i;
      if(!PB.state[i]) PB.state[i]={t0:now,held:false,target:FT()};
      const st=PB.state[i];
      const cell=fz(i); cell.classList.add("press");
      const dot=cell.querySelector(".fdot2"); dot.style.display="block";
      dot.style.left=((g.x*3-((i-1)%3))*100)+"%"; dot.style.top=(((1-g.y)*2-(((i-1)/3)|0))*100)+"%";
      if(st.target && !st.held && now-st.t0>=0.28 && !fArmed){ st.held=true; cell.classList.add("holdz"); cmd({cmd:"preset_mom",pad:i,on:true,...st.target}); } }  // HOLD → lean
    for(const id in PB.prev) if(!(id in cur)){ const i=PB.prev[id]; if(!Object.values(cur).includes(i)) pbRelease(i,now); }
    PB.prev=cur; }
  gEl.querySelectorAll('.fz').forEach((el,j)=>{
    let timer;
    el.onpointerdown=ev=>{if(locked)return;const i=j+1;const target=FT();if(!target)return;el.setPointerCapture(ev.pointerId);PB.state[i]={t0:performance.now()/1000,held:false,target};el.classList.add('press');timer=setTimeout(()=>{const st=PB.state[i];if(st&&!fArmed){st.held=true;cmd({cmd:'preset_mom',pad:i,on:true,...st.target});el.classList.add('holdz');}},280);};
    el.onpointerup=()=>{clearTimeout(timer);pbRelease(j+1,performance.now()/1000,true);};
    el.onpointercancel=()=>{clearTimeout(timer);pbRelease(j+1,performance.now()/1000,false);};
  });
  window.addEventListener('blur',()=>{unlock();for(const i in PB.state)pbRelease(+i,performance.now()/1000,false);});
  // ── frames from the probe ──
  function frame(s){ hz=s.hz; document.getElementById("padhz").textContent=(s.hz||0)+" Hz · "+s.fingers.length+" ▲"; if(!locked) return;
    if(LMODE==="fig"){ pbFrame(s,performance.now()/1000); return; }
    const now=performance.now()/1000, dt=Math.max(0.001,now-lastT); lastT=now;
    const c=s.fingers.filter(g=>g.state!=="leave"&&g.state!=="hover"); const byLane={}; for(const g of c){const l=Math.min(NL-1,Math.floor(g.x*NL))+1; if(!byLane[l]||g.size>byLane[l].size) byLane[l]=g;}
    for(const i in st.assign){ const lane=st.assign[i], g=byLane[lane], d=fad[i]; if(!d) continue; const cf=cfgOf(i);
      const f=F[i]=F[i]||{v:d.getVal(),home:d.getVal(),out:d.getVal(),touch:null,caught:false,lastTap:0};
      if(!f.touch&&!g){ /* idle: follow Arena unless springing */ if(cf.rel==="hold"){ f.v=f.out=d.getVal(); } }
      f.home=st.home[i]??f.home;
      if(g){ if(!f.touch){ f.v=d.getVal(); f.out=f.v; f.touch={y:g.y}; f.caught=(cf.touch!=="catch"); if(cf.touch==="abs") f.v=g.y; }
        else { if(cf.touch==="abs") f.v=g.y;
          else if(cf.touch==="rel"){ const fine=cf.pfine?Math.max(0.15,1-(g.size-0.3)):1; f.v=Math.max(0,Math.min(1,f.v+(g.y-f.touch.y)*cf.gain*fine)); f.touch.y=g.y; }
          else { if(!f.caught&&((f.touch.y<=f.v&&g.y>=f.v)||(f.touch.y>=f.v&&g.y<=f.v))) f.caught=true; if(f.caught) f.v=g.y; f.touch.y=g.y; } }
        const dot=d.querySelector(".fdot"); dot.style.display="block"; dot.style.bottom=(g.y*100)+"%";
      } else { if(f.touch) f.touch=null; d.querySelector(".fdot").style.display="none";
        if(cf.rel!=="hold"){ const tgt=cf.rel==="zero"?0:f.home; f.v+=(tgt-f.v)*Math.min(1,dt/Math.max(0.02,cf.spring)*3); } }
      const active=!!g||(cf.rel!=="hold"&&Math.abs(f.v-f.out)>0.0005);
      if(active){ f.out+=(f.v-f.out)*(1-cf.smooth); d.setVal(f.out); d.dataset.hold=Date.now(); cmd({cmd:"opacity",layer:+i,value:f.out}); }
      d.querySelector(".hm").style.bottom=(f.home*100)+"%";
    }
  }
  let pws; (function connect(){ pws=new WebSocket("ws://localhost:8770/"); pws.onmessage=e=>frame(JSON.parse(e.data)); pws.onclose=()=>{unlock();document.getElementById("padhz").textContent="probe off"; setTimeout(connect,1500);} })();
  function setHome(i,v){ st.home[i]=v; save(); const d=fad[i]; if(d) d.querySelector(".hm").style.bottom=(v*100)+"%"; }
  function homeOf(i){ return st.home[i]??0; }
  // Mouse holds always spring to zero; PAD keeps its independently saved release setting.
  function released(i,d,options={}){
    const cf={...cfgOf(i),...options};if(cf.rel==='hold')return;
    const tgt=cf.rel==='zero'?0:homeOf(i), revision=d.faderRevision;
    let v=d.getVal(),t=performance.now()/1000;
    const send=value=>{d.setVal(value);d.dataset.hold=Date.now();cmd({cmd:'opacity',layer:+i,value});};
    if(cf.immediate||cf.spring<=0){send(tgt);return;}
    const lifecycle=new AbortController(),signal=lifecycle.signal;
    const valid=()=>!d.isLocked()&&d.faderRevision===revision;
    const settle=()=>{if(valid())send(tgt);lifecycle.abort();};
    window.addEventListener('blur',settle,{signal});window.addEventListener('pagehide',settle,{signal});
    document.addEventListener('visibilitychange',()=>{if(document.hidden)settle();},{signal});
    (function step(){
      if(signal.aborted||!valid()){lifecycle.abort();return;}
      const now=performance.now()/1000,dt=now-t;t=now;v+=(tgt-v)*Math.min(1,dt/Math.max(.02,cf.spring)*3);
      if(Math.abs(v-tgt)<=.0005){settle();return;}send(v);requestAnimationFrame(step);
    })();
  }
  return {assign,laneOf,popover,paintLanes,setHome,homeOf,released,sync};
})();
// ═══ TABS: the probe's R&D pages (served by mt_probe on 8769) live here as tabs, not separate surfaces ═══
const MAINIDS=["quick","padbar","strip","rack","clips","ev"];
document.querySelectorAll("#tabs .tb").forEach(b=>b.onclick=()=>{
  document.querySelectorAll("#tabs .tb").forEach(x=>x.classList.toggle("on",x===b));
  const t=b.dataset.t, fr=document.getElementById("labfr");
  for(const id of MAINIDS) document.getElementById(id).style.display=t==="main"?"":"none";
  fr.style.display="none";
  if(t==="lab"||t==="lanes"||t==="pads"){ const src="http://localhost:8769/"+(t==="lab"?"":t); if(fr.dataset.src!==src){fr.src=src; fr.dataset.src=src;} fr.style.display="block"; }
});
