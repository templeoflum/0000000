      content: {}
    ArenaOnly:
      description: This endpoint is only available in Arena. Avenue returns 402 for all layer group endpoints.
      content: {}
  schemas:
    MonitorTarget:
      description: A render target that can be captured as a snapshot
      type: object
      required:
      - id
      - name
      properties:
        id:
          description: The unique render target ID (RTID) to use with the snapshot endpoint
          type: integer
          format: int64
        name:
          description: Human-readable name of the render target
          type: string
        associated_object:
          description: Optional REST API path to the associated composition object (e.g. layer or group)
          type: string
    FileUrl:
      description: |
        A file path in URL format. Special characters **must** be percent-encoded (URL-encoded).

        **Important:** Spaces must be encoded as `%20` or `+`. Failing to encode special characters is a common source of errors.

        **Format:**
        - Use the `file:///` protocol prefix
        - Use forward slashes `/` as path separators (even on Windows)
        - Three slashes are required after `file:`

        **Examples:**
        - macOS: `/Users/Resolume/My Videos/file.mov` → `file:///Users/Resolume/My%20Videos/file.mov`
        - Windows: `C:\Users\Resolume\My Videos\file.mov` → `file:///C:/Users/Resolume/My%20Videos/file.mov`

        **Characters that must be encoded:**
        - Space → `%20` or `+`
        - `#` → `%23`
        - `%` → `%25`
        - `&` → `%26`
        - `?` → `%3F`
      type: string
      example: "file:///Users/Resolume/My%20Videos/file.mov"
    ProductInfo:
      description: Generic information about the product serving the api
      type: object
      readOnly: true
      properties:
        name:
          description: The product name. This is either 'Arena' or 'Avenue'
          type: string
          example: Arena
        major:
          description: The major version number of the Arena or Avenue instance handling the request.
          type: integer
          format: int64
          example: 7
        minor:
          description: The minor version number of the Arena or Avenue instance handling the request.
          type: integer
          format: int64
          example: 8
        micro:
          description: The micro version number of the Arena or Avenue instance handling the request.
          type: integer
          format: int64
          example: 0
        revision:
          description: The revision of the Arena or Avenue instance handling the request.
          type: integer
          format: int64
      required:
        - name
        - major
        - minor
        - micro
        - revision
    ParameterView:
      description: Semantic information on the parameter, contains hints about how best to display the parameter
      type: object
      readOnly: true
      properties:
        suffix:
          description: The suffix to display for the variable. May be empty
          type: string
          example: '%'
        step:
          description: Value increments to be used for e.g. sliding or rotary controls
          type: number
          format: double
          example: 1.0
        multiplier:
          description: Value to multiply with when displaying value. For a parameter with a value between 0 and 1 should display as 0 to 100
          type: number
          format: double
          example: 1.0
        display_units:
          description: Which units to display.
          type: string
          enum: [real, integer, percent, degrees, decibels, frames_per_second, milliseconds, seconds, beats, fractions, hertz, pixels, factor]
        control_type:
          description: Which control to show for the parameter
          type: string
          enum: [based_on_param, choice_buttons, choice_combobox, spinner, duration_spinner, slider, slider_color_red, slider_color_green, slider_color_blue, slider_color_hue, slider_color_saturation, slider_color_brightness, slider_color_alpha, slider_color_opacity, color_pallette, color_picker, rotary, text, text_multiline]
      required:
        - suffix
    BooleanParameter:
      description: A parameter containing a true or false value
      type: object
      properties:
        id:
          description: The unique identifier of the parameter
          type: integer
          format: int64
          example: 1648023491239
        valuetype:
          description: The parameter type. This is "ParamBoolean" for this type
          type: string
          example: "ParamBoolean"
        value:
          description: The value for the parameter
          type: boolean
        view:
          $ref: '#/components/schemas/ParameterView'
    ChoiceParameter:
      description: A multiple-choice parameter
      type: object
      properties:
        id:
          description: The unique identifier of the parameter
          type: integer
          format: int64
          example: 1673448923421
        valuetype:
          description: The parameter type. This is "ParamChoice" or "ParamState" for this type
          type: string
          example: ParamChoice
        value:
          description: The value of the selected option
          type: string
          example: Option 1
        index:
          description: The index of the selected option within the options
          type: integer
          format: int32
          example: 0
        options:
          description: The list of available options for the parameter
          type: array
          items:
            type: string
          example: ["Option 1", "Option 2", "Option 3"]
        view:
          $ref: '#/components/schemas/ParameterView'
    ColorParameter:
      description: A parameter containing color data
      type: object
      properties:
        id:
          description: The unique identifier of the parameter
          type: integer
          format: int64
          example: 1682459812085
        valuetype:
          description: The parameter type. This is "ParamColor" for this type
          type: string
          example: ParamColor
        value:
          description:
            The color value. This always starts with a '#', followed by a number
            of hexadecimal values representing rgb and - optionally - the alpha
            channel. Each channel may be either represented by a single character -
            in which case the values are from 0 to 15 - or by two characters -
            allowing a range from 0 to 255 per channel.
          type: string
          example: "#ffffff"
        palette:
          description: Array of colors
          type: array
          items:
            type: string
          example: ["#ffffff", "#ff00ff", "#000"]
        view:
          $ref: '#/components/schemas/ParameterView'
    EventParameter:
      description: A parameter that handles events, but does not contain a value
      type: object
      properties:
        id:
          description: The unique identifier of the parameter
          type: integer
          format: int64
          example: 1865335878211
          readOnly: true
        valuetype:
          description: The parameter type. This is "ParamEvent" for this type
          type: string
          example: ParamEvent
          readOnly: true
        view:
          $ref: '#/components/schemas/ParameterView'
    IntegerParameter:
      description: A parameter containing numeric data
      type: object
      properties:
        id:
          description: The unique identifier of the parameter
          type: integer
          format: int64
          example: 1723491095783
        valuetype:
          description: The parameter type. This is "ParamNumber" for this type
          type: string
          example: ParamNumber
        value:
          description: The value for the parameter
          type: integer
          format: int64
          example: 100
        view:
          $ref: '#/components/schemas/ParameterView'
    RangeParameter:
      description: A parameter containing a floating-point value with a minimum
        and maximum allowed value.
      type: object
      properties:
        id:
          description: The unique identifier of the parameter
          type: integer
          format: int64
          example: 1824357891293
        valuetype:
          description: The parameter type. This is "ParamRange" for this type
          type: string
          example: ParamRange
        min:
          description: The lowest allowed value for the parameter, inclusive
          type: number
          format: double
          example: 0.0
        max:
          description: The highest allowed value for the parameter, inclusive
          type: number
          format: double
          example: 100.0
        in:
          description: The lowest value we clamped the range to, inclusive
          type: number
          format: double
          example: 25.0
        out:
          description: The highest value we clamped the range to, inclusive
          type: number
          format: double
          example: 75.0
        value:
          description: The value for the parameter
          type: number
          format: double
          example: 50.0
        view:
          $ref: '#/components/schemas/ParameterView'
    StringParameter:
      description: A parameter containing string data
      type: object
      properties:
        id:
          description: The unique identifier of the parameter
          type: integer
          format: int64
          example: 1641335430527
        valuetype:
          description: The parameter type. This is "ParamString" for this type
          type: string
          example: ParamString
        value:
          description: The value for the parameter
          type: string
        view:
          $ref: '#/components/schemas/ParameterView'
    TextParameter:
      description: A parameter containing string data, possibly multiline
      type: object
      properties:
        id:
          description: The unique identifier of the parameter
          type: integer
          format: int64
          example: 1638334400287
        valuetype:
          description: The parameter type. This is "ParamText" for this type
          type: string
          example: ParamText
        value:
          description: The value for the parameter
          example: |
            Some
            Multiline
            String
        view:
          $ref: '#/components/schemas/ParameterView'
    FileParameter:
      description: A parameter that holds a file path. When extensions are present, only files with those extensions are accepted.
      type: object
      properties:
        id:
          description: The unique id of the parameter
          type: integer
          format: int64
          example: 1638334400287
        valuetype:
          description: The parameter type. This is "ParamFile" for this type
          type: string
          example: ParamFile
        value:
          description: The file path
          type: string
          example: "C:/path/to/file.png"
        extensions:
          description: Accepted file extensions. Empty array or absent means any file is accepted.
          type: array
          items:
            type: string
          example: ["png", "jpg", "bmp", "tga", "tiff"]
        view:
          $ref: '#/components/schemas/ParameterView'
    ResetParameter:
      description: Options for resetting a parameter, should only the value be reset, or should animations also be reset
      type: object
      properties:
        resetanimation:
          description: If set to true, animations are also reset
          type: boolean
    ParameterCollection:
      description: An unstructured collection of parameters. Parameters are presented as a map where
        the key is the name of the parameter and the value is the parameter itself. Parameters may be
        any valid parameter type.
      type: object
      additionalProperties:
        oneOf:
          - $ref: '#/components/schemas/StringParameter'
          - $ref: '#/components/schemas/TextParameter'
          - $ref: '#/components/schemas/BooleanParameter'
          - $ref: '#/components/schemas/IntegerParameter'
          - $ref: '#/components/schemas/ColorParameter'
          - $ref: '#/components/schemas/RangeParameter'
          - $ref: '#/components/schemas/ChoiceParameter'
          - $ref: '#/components/schemas/FileParameter'
    AudioEffect:
      description: An audioeffect represents a single effect in a chain of effects to be applied to
        a source. Properties on the audioeffect control how and what is rendered in the effect. Unlike video effects, audio effects are always user removable.
      type: object
      properties:
        id:
          description: The unique id of the audio effect instance
          type: integer
          format: int64
          readOnly: true
        name:
          description: The name of the effect
          type: string
          example: Distortion
        display_name:
          description: User-defined display name for the effect, set via the set-display-name endpoint
          type: string
          example: My Distortion
        bypassed:
          $ref: '#/components/schemas/BooleanParameter'
        params:
          $ref: '#/components/schemas/ParameterCollection'
    VideoEffect:
      description: A videoeffect represents a single effect in a chain of effects to be applied to
        a source. Properties on the videoeffect control how and what is rendered in the effect.
      type: object
      properties:
        id:
          description: The unique id of the video effect instance
          type: integer
          format: int64
          example: 1723069642348
          readOnly: true
        is_user_removable:
          description: Can the video effect be removed
          type: boolean
          example: true
          readOnly: true
        name:
          description: The unique name of the key
          type: string
          example: ChromaKey
        display_name:
          description: The name to show the user
          type: string
          example: ChromaKey
        bypassed:
          description: Bypassed param is not always available, primary Transform for example is not allowed to by bypassed
          type: object
          nullable: true
          allOf:
            - $ref: '#/components/schemas/BooleanParameter'
        mixer:
          $ref: '#/components/schemas/ParameterCollection'
        params:
          $ref: '#/components/schemas/ParameterCollection'
    AudioFileInfo:
      description: Meta information for an audio file
      type: object
      readOnly: true      
      nullable: true
      properties:
        path:
          description: The location of the file on disk
          type: string
          example: /Users/Resolume/Music/Track1.wav
        exists:
          description: Whether file is actully present on disk at the given location
          type: boolean
          example: true
        format:
          description: The format of the audio file
          type: string
          example: "AIFF"
        duration:
          description: Duration of file expressed as hours:seconds:minutes:milliseconds
          type: string
          example: "00:12:08.085"
        duration_ms:
          description: Duration of file expressed as milliseconds
          type: number
          format: double
          example: 728084.8979591837
        sample_rate:
          description: Sample rate expressed in Hertz
          type: number
          format: double
          example: 44100
        num_channels:
          description: Number of audio channels
          type: integer
          format: int32
          example: 2
        bpm:
          description: Bpm rate expressed in beats
          type: number
          format: double
          example: 0
      required:
        - path
        - exists
        - format
        - duration
        - duration_ms
        - sample_rate
        - num_channels
        - bpm
    AudioTrack:
      description: An audio track, as part of a clip,layer,group or a composition
      type: object
      nullable: true
      properties:
        volume:
          $ref: '#/components/schemas/RangeParameter'
        pan:
          $ref: '#/components/schemas/RangeParameter'
        effects:
          description: All the effects that may be applied when the audio track is played
          type: array
          items:
            $ref: '#/components/schemas/AudioEffect'
    AudioTrackClip:
      allOf:
        - $ref: '#/components/schemas/AudioTrack'
        - type: object
          properties:
            description:
              description: The description of the source belonging to this audio track
              type: string
            fileinfo:
              $ref: '#/components/schemas/AudioFileInfo'
    AutoPilot:
      description: AutoPilot options to control automatic clip transitions
      type: object
      nullable: true
      properties:
        target:
          $ref: '#/components/schemas/ChoiceParameter'
        duration_type:
          $ref: '#/components/schemas/ChoiceParameter'
        beats:
          $ref: '#/components/schemas/RangeParameter'
        seconds:
          $ref: '#/components/schemas/RangeParameter'
        loop_count:
          $ref: '#/components/schemas/RangeParameter'
        random_type:
          $ref: '#/components/schemas/ChoiceParameter'
        loop:
          $ref: '#/components/schemas/BooleanParameter'
        compensate_transition:
          $ref: '#/components/schemas/BooleanParameter'
    TransportBPMSync:
      description: The timeline transport controls
      type: object
      nullable: true
      properties:
        position:
          $ref: '#/components/schemas/RangeParameter'
        controls:
          description: BPM Sync controls
          type: object
          nullable: false
          properties:
            playdirection:
              $ref: '#/components/schemas/ChoiceParameter'
            playmode:
              $ref: '#/components/schemas/ChoiceParameter'
            playmodeaway:
              $ref: '#/components/schemas/ChoiceParameter'
            duration:
              $ref: '#/components/schemas/RangeParameter'
            speed:
              $ref: '#/components/schemas/RangeParameter'
            syncmode:
              $ref: '#/components/schemas/ChoiceParameter'
            beatloop:
              $ref: '#/components/schemas/ChoiceParameter'
    TransportTimeline:
      description: The timeline transport controls
      type: object
      nullable: true
      properties:
        position:
          $ref: '#/components/schemas/RangeParameter'
        controls:
          description: Timeline controls
          type: object
          nullable: false
          properties:
            playdirection:
              $ref: '#/components/schemas/ChoiceParameter'
            playmode:
              $ref: '#/components/schemas/ChoiceParameter'
            playmodeaway:
              $ref: '#/components/schemas/ChoiceParameter'
            duration:
              $ref: '#/components/schemas/RangeParameter'
            speed:
              $ref: '#/components/schemas/RangeParameter'
    Clip:
      type: object
      description: A single clip in the composition, which may contain a video and/or audio track
      properties:
        id:
          description: The unique id of the clip
          type: integer
          format: int64
          example: 1641549604745
          readOnly: true
        name:
          $ref: '#/components/schemas/StringParameter'
        colorid:
          $ref: '#/components/schemas/ChoiceParameter'
        selected:
          description: Get whether the clip is currently selected. If a clip is selected the properties
            will show up in Arena or Avenue and in the example react application.
          readOnly: true
          allOf:
            - $ref: '#/components/schemas/BooleanParameter'
        connected:
          description: Get whether the clip is currently connected.
          readOnly: true
          allOf:
            - $ref: '#/components/schemas/ChoiceParameter'
        target:
          $ref: '#/components/schemas/ChoiceParameter'
        triggerstyle:
          $ref: '#/components/schemas/ChoiceParameter'
        ignorecolumntrigger:
          $ref: '#/components/schemas/ChoiceParameter'
        faderstart:
          $ref: '#/components/schemas/ChoiceParameter'
        beatsnap:
          $ref: '#/components/schemas/ChoiceParameter'
        transporttype:
          $ref: '#/components/schemas/ChoiceParameter'
        transport:
          description: Only Timeline and BPM Sync transport types are supported at the moment
          oneOf:
            - $ref: '#/components/schemas/TransportTimeline'
            - $ref: '#/components/schemas/TransportBPMSync'
        transition:
          $ref: '#/components/schemas/ClipTransition'
        dashboard:
          $ref: '#/components/schemas/ParameterCollection'
        audio:
          $ref: '#/components/schemas/AudioTrackClip'
        video:
          $ref: '#/components/schemas/VideoTrackClip'
        thumbnail:
          description: The thumbnail properties contain information with the latest update to
            the thumbnail, the size (in bytes) and whether it contains the 'default' thumbnail,
            meaning it doesn't contain a video or audio track
          type: object
          readOnly: true
          properties:
            last_update:
              description: The timestamp of the last update, in milliseconds. Given as a string
                to prevent lesser languages from truncating the value
              type: string
              example: "0"
            is_default:
              description: Get whether this is a default thumbnail, shared between all clips that
                don't have any video or audio tracks
              type: boolean
              example: true
    Column:
      type: object
      description: A column within a deck
      properties:
        id:
          description: The unique identifier of the column
          type: integer
          format: int64
          example: 1641549605447
          readOnly: true
        name:
          $ref: '#/components/schemas/StringParameter'
        colorid:
          $ref: '#/components/schemas/ChoiceParameter'
        connected:
          description: Get or set the connection state of the column. Triggering this will connect or disconnect the column.
          allOf:
            - $ref: '#/components/schemas/ChoiceParameter'
        selected:
          description: Get whether the column is currently selected
          readOnly: true
          allOf:
            - $ref: '#/components/schemas/BooleanParameter'
        beatsnap:
          $ref: '#/components/schemas/ChoiceParameter'
        clipconnected:
          description: Get whether clips in this column are currently connected
          readOnly: true
          allOf:
            - $ref: '#/components/schemas/BooleanParameter'
    CrossFader:
      description: Cross fade between two clips
      type: object
      nullable: false
      properties:
        id:
          description: The unique identifier of the cross fader
          type: integer
          format: int64
          example: 1
          readOnly: true
        phase:
          $ref: '#/components/schemas/RangeParameter'
        behaviour:
          $ref: '#/components/schemas/ChoiceParameter'
        curve:
          $ref: '#/components/schemas/ChoiceParameter'
        sidea:
          $ref: '#/components/schemas/EventParameter'
        sideb:
          $ref: '#/components/schemas/EventParameter'
        mixer:
          $ref: '#/components/schemas/ParameterCollection'
    Deck:
      type: object
      description: A deck contains a full set of layers and clips. Only the layers and clips of the
        active deck can be retrieved and updated.
      properties:
        id:
          description: The unique identifier of the deck
          type: integer
          format: int64
          example: 1641549604727
          readOnly: true
        closed:
          description: Is this deck closed
          type: boolean
          example: false
          readOnly: true
        name:
          $ref: '#/components/schemas/StringParameter'
        colorid:
          $ref: '#/components/schemas/ChoiceParameter'
        selected:
          description: Get whether the deck is currently selected
          readOnly: true
          allOf:
            - $ref: '#/components/schemas/BooleanParameter'
        scrollx:
          $ref: '#/components/schemas/IntegerParameter'
    Effect:
      description: An effect to be used on a clip. layer (group) or the composition
      type: object
      readOnly: true
      properties:
        idstring:
          description: The unique identifier for the effect
          type: string
          example: A139
        name:
          description: The descriptive name of the effect
          type: string
          example: Blow
        description:
          description: A human-readable description of the effect
          type: string
          example: Blows the image apart
        category:
          description: The category the effect belongs to
          type: string
          example: Video Effects
        presets:
          description: All the presets for this effect
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
                format: int64
                example: 2026888427
                description: The unique identifier for the preset
              name:
                type: string
                example: Bright Lines
                description: The name of the preset
      required:
        - idstring
        - name
        - description
        - category
        - presets
    Effects:
      description: The available effects for clips, layer (group)s and the composition
      type: object
      readOnly: true
      properties:
        video:
          description: The available video effects
          type: array
          items:
            $ref: '#/components/schemas/Effect'
        audio:
          description: The available audio effects
          type: array
          items:
            $ref: '#/components/schemas/Effect'
      required:
        - video
    FrameRate:
      description: Frame rate expressed as ratio
      type: object
      readOnly: true
      properties:
        num:
          description: Numerator
          type: integer
          format: int32
          example: 24000
        denom:
          description: Denominator
          type: integer
          format: int32
          example: 1001
      required:
        - num
        - denom
    Source:
      description: A source to be used in a clip
      type: object
      readOnly: true
      properties:
        idstring:
          description: The unique identifier for the source
          type: string
          example: A401
        name:
          description: The descriptive name of the source
          type: string
          example: Gradient
        description:
          description: A human-readable description of the source
          type: string
          example: Generates a color gradient
        category:
          description: The category the source belongs to
          type: string
          example: Video Sources
        presets:
          description: All the presets for this source
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
                format: int64
                example: 2026883901
                description: The unique identifier for the preset
              name:
                type: string
                example: Dutch Sky
                description: The name of the preset
      required:
        - idstring
        - name
        - description
        - category
        - presets
    Sources:
      description: The available sources for clips
      type: object
      readOnly: true
      properties:
        video:
          description: The available video sources
          type: array
          items:
            $ref: '#/components/schemas/Source'
      required:
        - video
    FileInfo:
      description: Audio- and video information for a file
      type: object
      readOnly: true
      nullable: false
      properties:
        uri:
          description: The URI to the file this information is about
          type: string
          example: file:///Users/Resolume/Videos/Clip1.mov
        exists:
          description: Does the path resolve to a file that does exist
          type: boolean
          example: true
        file_size:
          description: The number of bytes in the file, if found
          type: integer
          format: int64
          nullable: true
        audio:
          $ref: '#/components/schemas/AudioFileInfo'
        video:
          $ref: '#/components/schemas/VideoFileInfo'
      required:
        - uri
        - exists
    VideoFileInfo:
      description: Meta information for a video file
      type: object
      readOnly: true
      nullable: true
      properties:
        path:
          description: The location of the file on disk
          type: string
          example: /Users/Resolume/Videos/Clip1.mov
        exists:
          description: Whether file is actually present on disk at the given location
          type: boolean
          example: true
        duration:
          description: Duration of file expressed as hours:seconds:minutes:milliseconds
          type: string
          example: "00:00:19.06"
        duration_ms:
          description: Duration of file expressed as milliseconds
          type: number
          format: double
          example: 19269.249999999996
          readOnly: true
        framerate:
          $ref: '#/components/schemas/FrameRate'
        width:
          description: The number of pixels the video is wide
          type: integer
          format: int32
          example: 1920
        height:
          description: The number of pixels the video is high
          type: integer
          format: int32
          example: 1080
      required:
        - path
        - exists
        - duration
        - duration_ms
        - framerate
        - width
        - height
    ClipTransition:
      description: A clip transition describes the transition between clips
      type: object
      properties:
        layer_determined:
          $ref: '#/components/schemas/BooleanParameter'
        duration:
          $ref: '#/components/schemas/RangeParameter'
        blend_mode:
          $ref: '#/components/schemas/ChoiceParameter'
        params:
          $ref: '#/components/schemas/ParameterCollection'
    LayerTransition:
      description: A layer transition describes the transition between clips within the layer
      type: object
      properties:
        duration:
          $ref: '#/components/schemas/RangeParameter'
        blend_mode:
          $ref: '#/components/schemas/ChoiceParameter'
        params:
          $ref: '#/components/schemas/ParameterCollection'
    VideoTrack:
      description: A video track, as part of a clip,layer,group or a composition
      type: object
      nullable: true
      properties:
        width:
          $ref: '#/components/schemas/RangeParameter'
        height:
          $ref: '#/components/schemas/RangeParameter'
        opacity:
          $ref: '#/components/schemas/RangeParameter'
        mixer:
          $ref: '#/components/schemas/ParameterCollection'
        effects:
          description: All the effects that may be applied when the video track is played
          type: array
          items: 
            $ref: '#/components/schemas/VideoEffect'
    VideoTrackLayer:
      allOf:
        - $ref: '#/components/schemas/VideoTrack'
        - type: object
          properties:
            autosize:
              $ref: '#/components/schemas/ChoiceParameter'
    VideoTrackClip:
      allOf:
        - $ref: '#/components/schemas/VideoTrack'
        - type: object
          properties:
            description:
              description: The description of the source belonging to this video track
              type: string
              example: Clip1.mov\nDXV 3.0 Normal Quality, With Alpha, 1920x1080, 23.98 Fps\r\n00:00:19.269
            fileinfo:
              $ref: '#/components/schemas/VideoFileInfo'
            resize:
              $ref: '#/components/schemas/ChoiceParameter'
            r:
              $ref: '#/components/schemas/BooleanParameter'
            g:
              $ref: '#/components/schemas/BooleanParameter'
            b:
              $ref: '#/components/schemas/BooleanParameter'
            a:
              $ref: '#/components/schemas/BooleanParameter'
            sourceparams:
              description: Additional params for source of the clip
              type: object
              nullable: true
              allOf:
                - $ref: '#/components/schemas/ParameterCollection'
    TempoController:
      description: The controller for various tempo-related aspects of the composition
      type: object
      properties:
        tempo:
          $ref: '#/components/schemas/RangeParameter'
        play_state:
          $ref: '#/components/schemas/ChoiceParameter'
        tempo_pull:
          $ref: '#/components/schemas/EventParameter'
        tempo_push:
          $ref: '#/components/schemas/EventParameter'
        tempo_tap:
          $ref: '#/components/schemas/EventParameter'
        resync:
          $ref: '#/components/schemas/EventParameter'
    Layer:
      description: A layer is a container for clips that has its own dashboard and can be selected
      type: object
      properties:
        id:
          description: The unique id for the layer
          type: integer
          format: int64
          example: 1641549604807
          readOnly: true
        name:
          $ref: '#/components/schemas/StringParameter'
        colorid:
          $ref: '#/components/schemas/ChoiceParameter'
        selected:
          description: Get whether the layer is currently selected
          readOnly: true
          allOf:
            - $ref: '#/components/schemas/BooleanParameter'
        bypassed:
          $ref: '#/components/schemas/BooleanParameter'
        solo:
          $ref: '#/components/schemas/BooleanParameter'
        crossfadergroup:
          $ref: '#/components/schemas/ChoiceParameter'
        master:
          $ref: '#/components/schemas/RangeParameter'
        maskmode:
          $ref: '#/components/schemas/ChoiceParameter'
        ignorecolumntrigger:
          $ref: '#/components/schemas/BooleanParameter'
        faderstart:
          $ref: '#/components/schemas/BooleanParameter'
        dashboard:
          $ref: '#/components/schemas/ParameterCollection'
        audio:
          $ref: '#/components/schemas/AudioTrack'
        video:
          $ref: '#/components/schemas/VideoTrackLayer'
        transition:
          $ref: '#/components/schemas/LayerTransition'
        clips:
          description: All clips belonging to this layer
          type: array
          items: 
            $ref: '#/components/schemas/Clip'
        active_clip:
          description: The currently active (playing) clip
          type: object
          nullable: true
          allOf:
            - $ref: '#/components/schemas/Clip'
        autopilot:
          $ref: '#/components/schemas/AutoPilot'
    LayerGroup:
      description: A collection of layers, allowing controlling of a group of layers as a single object
      type: object
      properties:
        id:
          description: The unique id for the layer group
          type: integer
          format: int64
          example: 1641549604808
          readOnly: true
        name:
          $ref: '#/components/schemas/StringParameter'
        colorid:
          $ref: '#/components/schemas/ChoiceParameter'
        selected:
          description: Get whether the layer group is currently selected
          readOnly: true
          allOf:
            - $ref: '#/components/schemas/BooleanParameter'
        bypassed:
          $ref: '#/components/schemas/BooleanParameter'
        solo:
          $ref: '#/components/schemas/BooleanParameter'
        crossfadergroup:
          $ref: '#/components/schemas/ChoiceParameter'
        master:
          $ref: '#/components/schemas/RangeParameter'
        speed:
          $ref: '#/components/schemas/RangeParameter'
        ignorecolumntrigger:
          $ref: '#/components/schemas/BooleanParameter'
        dashboard:
          $ref: '#/components/schemas/ParameterCollection'
        audio:
          $ref: '#/components/schemas/AudioTrack'
        video:
          $ref: '#/components/schemas/VideoTrack'
        layers:
          description: All the layers added to the layer group
          type: array
          items:
            $ref: '#/components/schemas/Layer'
    Composition:
      description: The complete composition, containing all the decks, layers, clips and their effects
      type: object
      properties:
        name:
          $ref: '#/components/schemas/StringParameter'
        selected:
          allOf:
            - $ref: '#/components/schemas/BooleanParameter'
            - readOnly: true
        bypassed:
          $ref: '#/components/schemas/BooleanParameter'
        master:
          $ref: '#/components/schemas/RangeParameter'
        speed:
          $ref: '#/components/schemas/RangeParameter'
        cliptarget:
          $ref: '#/components/schemas/ChoiceParameter'
        cliptriggerstyle:
          $ref: '#/components/schemas/ChoiceParameter'
        clipbeatsnap:
          $ref: '#/components/schemas/ChoiceParameter'
        dashboard:
          $ref: '#/components/schemas/ParameterCollection'
        audio:
          $ref: '#/components/schemas/AudioTrack'
        video:
          $ref: '#/components/schemas/VideoTrack'
        crossfader:
          $ref: '#/components/schemas/CrossFader'
        decks:
          description: All decks in the composition
          type: array
          items:
            $ref: '#/components/schemas/Deck'
        layers:
          description: All layers in the composition
          type: array
          items:
            $ref: '#/components/schemas/Layer'
        columns:
          description: All columns in the composition
          type: array
          items:
            $ref: '#/components/schemas/Column'
        layergroups:
          description: All layergroups in the composition
          type: array
          items:
            $ref: '#/components/schemas/LayerGroup'
        tempocontroller:
          $ref: '#/components/schemas/TempoController'
