openapi: 3.0.1
info:
  title: Arena & Avenue REST API
  description: |
    This is the API reference for the Resolume Arena & Avenue REST API. To use this API, start Resolume Arena or Avenue and enable the server under the 'Webserver' heading in the preferences.

    ## Accessing Resources

    Most resources (layers, clips, columns, etc.) can be accessed in multiple ways:

    - **By index** (1-based): `/composition/layers/1` - Access by position in the composition. Indices change when items are reordered.
    - **By unique ID**: `/composition/layers/by-id/1658311521181` - Access by stable identifier. IDs remain constant across sessions and reordering.
    - **Selected item**: `/composition/layers/selected` - Access the currently selected item. Returns 404 if nothing is selected.

    Use **by-id** when you need stable references that survive reordering. Use **by-index** for positional access. Use **selected** for operations on whatever the user has selected in the UI.

    ## URL Encoding

    When passing file paths or URLs in request bodies, you **must** use proper URL encoding:

    - Spaces must be encoded as `%20` (or `+`)
    - Special characters like `#`, `&`, `?`, `=` must be percent-encoded
    - Use three forward slashes after `file:` even on Windows

    **Examples:**
    - macOS: `file:///Users/Resolume/My Videos/file 1.mov` → `file:///Users/Resolume/My%20Videos/file%201.mov`
    - Windows: `C:\Users\Resolume\My Videos\file 1.mov` → `file:///C:/Users/Resolume/My%20Videos/file%201.mov`

    A common mistake is forgetting to encode spaces - the API will return an error or fail to find the file if paths are not properly encoded.
  contact:
    email: support@resolume.com
  version: 0.0.1
servers:
- url: /api/v1
security: []
tags:
- name: api
  description: Retrieve information about the API itself
- name: files
  description: Retrieve information about files and the streams they contain
- name: sources
  description: Retrieve information on the available sources
- name: effects
  description: Retrieve information on the available effects
- name: composition
  description: Retrieve and update all composition properties
- name: column
  description: Retrieve and update column properties
- name: layer
  description: Retrieve and update layer properties and the clips they contain
- name: layergroup
  description: "Retrieve and update layer group properties and the layers they contain. Arena only: Avenue returns 402 for all layer group endpoints."
- name: deck
  description: Retrieve and update deck properties
- name: clip
  description: Retrieve and update properties for clips and their effects
- name: monitors
  description: List available render targets and capture snapshots
paths:
  /product:
    get:
      tags:
      - api
      summary: Retrieve product information
      description: This contains the product name and version information
      operationId: get_product
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductInfo'
  /effects:
    get:
      tags:
      - effects
      summary: Retrieve available effects for clips
      description: Retrieve all effects available for using on clips, layer(group)s and the composition
      operationId: get_effects
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Effects'
  /effects/audio:
    get:
      tags:
      - effects
      summary: Retrieve available audio effects
      description: Retrieve all audio effects available for using on clips, layer(group)s and the composition
      operationId: get_audio_effects
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Effect'
  /sources:
    get:
      tags:
      - sources
      summary: Retrieve available sources for clips
      description: Retrieve all sources available to generate clips
      operationId: get_sources
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sources'
  /parameter/by-id/{parameter-id}:
    parameters:
    - name: parameter-id
      in: path
      description: The unique id of the parameter to work with
      required: true
      schema:
        type: integer
        format: int64
    get:
      tags:
      - composition
      summary: Retrieve a parameter given its unique id
      description: Given the unique id, get all properties for a single parameter
      operationId: get_parameter_by_id
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/StringParameter'
                  - $ref: '#/components/schemas/TextParameter'
                  - $ref: '#/components/schemas/BooleanParameter'
                  - $ref: '#/components/schemas/IntegerParameter'
                  - $ref: '#/components/schemas/ColorParameter'
                  - $ref: '#/components/schemas/RangeParameter'
                  - $ref: '#/components/schemas/ChoiceParameter'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags:
      - composition
      summary: Update a parameter given its unique id
      description: Given the unique id, update a single parameter
      operationId: set_parameter_by_id
      requestBody:
        description: The parameter properties to set
        content:
          application/json:
            schema:
                oneOf:
                  - $ref: '#/components/schemas/StringParameter'
                  - $ref: '#/components/schemas/TextParameter'
                  - $ref: '#/components/schemas/BooleanParameter'
                  - $ref: '#/components/schemas/IntegerParameter'
                  - $ref: '#/components/schemas/ColorParameter'
                  - $ref: '#/components/schemas/RangeParameter'
                  - $ref: '#/components/schemas/ChoiceParameter'
      responses:
        '204':
          description: OK
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /parameter/by-id/{parameter-id}/reset:
    parameters:
    - name: parameter-id
      in: path
      description: The unique id of the parameter to work with
      required: true
      schema:
        type: integer
        format: int64
    post:
      tags:
      - composition
      summary: Reset a parameter
      description: Reset the parameter with the matching unique id
      operationId: reset_parameter_by_id
      requestBody:
        description: Options used for resetting the parameter, e.g. whether to reset animation
        content:
          application/json:
            schema:
              type: object
              properties:
                resetanimation:
                  description: Whether or not to also reset the animation
                  type: boolean
      responses:
        '204':
          description: OK
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /parameter/by-id/{parameter-id}/trigger:
    parameters:
    - name: parameter-id
      in: path
      description: The unique id of the parameter to trigger
      required: true
      schema:
        type: integer
        format: int64
    post:
      tags:
      - composition
      summary: Trigger a parameter
      description: Trigger the parameter with the matching unique id. This is useful for button-type parameters.
      operationId: trigger_parameter_by_id
      responses:
        '204':
          description: OK
        '404':
          $ref: '#/components/responses/NotFound'
  /parameter/by-id/{parameter-id}/phase-source:
    parameters:
    - name: parameter-id
      in: path
      description: The unique id of the parameter
      required: true
      schema:
        type: integer
        format: int64
    get:
      tags:
      - composition
      summary: Get the phase source of a parameter
      description: >
        Returns the current phase source (animation driver) of the parameter and its
        sub-parameters. Phase source types: static, timeline, bpm_sync, composition_fft,
        external_fft, entity_fft, crossfader, clip_position, transition, dashboard.
        Sub-parameters are real Arena parameters with IDs that can be set via
        PUT /parameter/by-id/{id}.
      operationId: get_parameter_phase_source
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  phase_source:
                    type: string
                    description: The phase source type
                    example: bpm_sync
                  dial:
                    type: integer
                    minimum: 1
                    maximum: 8
                    nullable: true
                    description: Dashboard dial index (1-8). Only present when phase_source is dashboard.
                  parameters:
                    type: object
                    description: Sub-parameters of the phase source (only present for parameterized types)
                    additionalProperties:
                      oneOf:
                        - $ref: '#/components/schemas/RangeParameter'
                        - $ref: '#/components/schemas/ChoiceParameter'
                        - $ref: '#/components/schemas/BooleanParameter'
                        - $ref: '#/components/schemas/IntegerParameter'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags:
      - composition
      summary: Set the phase source of a parameter
      description: >
        Set the phase source (animation driver) of the parameter. Use GET to read back
        the new phase source sub-parameters and their IDs. Dashboard requires a dial field (1-8).
        Some sources have entity restrictions: clip_position is clip-only, transition is
        clip/layer-only, entity_fft is not available for crossfader parameters.
      operationId: set_parameter_phase_source
      requestBody:
        description: The phase source to set
        content:
          application/json:
            schema:
              type: object
              required:
              - phase_source
              properties:
                phase_source:
                  type: string
                  enum:
                  - static
                  - timeline
                  - bpm_sync
                  - composition_fft
                  - external_fft
                  - entity_fft
                  - crossfader
                  - clip_position
                  - transition
                  - dashboard
                  description: The phase source type to set
                dial:
                  type: integer
                  minimum: 1
                  maximum: 8
                  description: Dashboard dial index (1-8). Required when phase_source is dashboard.
            examples:
              bpm_sync:
                value: { "phase_source": "bpm_sync" }
              timeline:
                value: { "phase_source": "timeline" }
              static:
                value: { "phase_source": "static" }
              composition_fft:
                value: { "phase_source": "composition_fft" }
              dashboard:
                value: { "phase_source": "dashboard", "dial": 3 }
      responses:
        '204':
          description: OK
        '400':
          description: Bad request (unsupported phase source or could not determine parameter owner)
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags:
      - composition
      summary: Reset the phase source to static
      description: Resets the parameter's phase source to the default static state (no animation).
      operationId: delete_parameter_phase_source
      responses:
        '204':
          description: OK
        '400':
          description: Could not determine parameter owner
        '404':
          $ref: '#/components/responses/NotFound'
  /file-info:
    post:
      tags:
      - files
      summary: Retrieve information about files
      description: Query the filesystem for streams available in files
      operationId: file_info
      requestBody:
        description: The files to retrieve information about
        content:
          application/json:
            schema:
              type: array
              items:
                description: The file we need information about, in URL-format
                example: file:///Users/Resolume/Videos/File1.mov
                type: string
      x-codegen-request-body-name: file-info
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FileInfo'
  /composition:
    get:
      tags:
      - composition
      summary: Retrieve the complete composition
      description: This contains the composition properties, all the decks, layers
        and clips
      operationId: list_composition
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Composition'
    put:
      tags:
      - composition
      summary: Update the complete composition
      description: This allows for updating all parameters in a composition, its decks,
        layers and clips
      operationId: replace_composition
      requestBody:
        description: The updated composition properties, with possible decks, layers
          and/or clips
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Composition'
        required: true
      responses:
        '204':
          description: OK
        '400':
          $ref: '#/components/responses/BadRequest'
  /composition/open:
    post:
      tags:
      - composition
      summary: Open a new composition
      description: Load a composition by file
      operationId: open_composition
      requestBody:
          description: |
            The path to the composition file, in URL format.

            **Important:** All special characters must be percent-encoded. Spaces must be encoded as `%20` - this is a common source of errors.

            **Format rules:**
            - Use `file:///` prefix (three forward slashes)
            - Use forward slashes `/` as separators, even on Windows
            - Encode spaces as `%20` or `+`

            **Examples:**
            - `/Users/Resolume/Documents/file 1.avc` → `file:///Users/Resolume/Documents/file%201.avc`
            - `C:\Users\Resolume\Documents\file 1.avc` → `file:///C:/Users/Resolume/Documents/file%201.avc`
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/FileUrl'
              examples:
                mac-open-file:
                  value: "file:///Users/Resolume/Documents/file%201.avc"
                windows-open-file:
                  value: "file:///C:/Users/Resolume/Documents/file%201.avc"
      x-codegen-request-body-name: composition-open
      responses:
          '204':
            description: OK
          '400':
            description: Invalid file path
            content: {}
          '412':
            $ref: '#/components/responses/PreconditionFailed'
  /composition/new:
    post:
      tags:
      - composition
      summary: Clear the composition, and start with a blank slate
      description: Throws away any unsaved changes, and starts with the default composition
      operationId: new_composition
      responses:
        '204':
          description: OK
        '412':
          $ref: '#/components/responses/PreconditionFailed'
  /composition/save:
    post:
      tags:
      - composition
      summary: Save the composition
      description: Save the current composition to disk
      operationId: save_composition
      requestBody:
        description: |
          The path for the composition file, in URL format. If omitted, saves to the current file.

          **Important:** All special characters must be percent-encoded. Spaces must be encoded as `%20` - this is a common source of errors.

          **Format rules:**
          - Use `file:///` prefix (three forward slashes)
          - Use forward slashes `/` as separators, even on Windows
          - Encode spaces as `%20` or `+`

          **Examples:**
          - `/Users/Resolume/Documents/file 1.avc` → `file:///Users/Resolume/Documents/file%201.avc`
          - `C:\Users\Resolume\Documents\file 1.avc` → `file:///C:/Users/Resolume/Documents/file%201.avc`
        content:
          text/plain:
            schema:
              $ref: '#/components/schemas/FileUrl'
            examples:
              mac-save-file:
                value: "file:///Users/Resolume/Documents/file%201.avc"
              windows-save-file:
                value: "file:///C:/Users/Resolume/Documents/file%201.avc"
        required: false
      x-codegen-request-body-name: composition-save
      responses:
        '204':
          description: OK
        '412':
          $ref: '#/components/responses/PreconditionFailed'
  /composition/grow-to:
    post:
      tags:
      - composition
      summary: Grow the composition to at least the given dimensions
      description: Ensure the composition has at least the given number of
        columns and layer. It will never shrink as a result of this call.
      operationId: composition_grow_to
      requestBody:
        description: The dimensions to grow to, at least one field must be set
        content:
          application/json:
            schema:
              description: The number of columns and/or layers to ensure
              properties:
                column_count:
                  description: The minimum number of columns to ensure
                  type: integer
                  format: int64
                  example: 15
                layer_count:
                  description: The minimum number of layers to ensure
                  type: integer
                  format: int64
                  example: 8
      responses:
        '204':
          description: OK
        '400':
          $ref: '#/components/responses/BadRequest'
  /composition/action:
    post:
      tags:
      - composition
      summary: Undo or redo previously executed actions
      description: With this call an action can be either undone, or an action that was undone
        can be executed again
      operationId: composition_action
      requestBody:
        description: Indicate whether you want to undo- or redo an action
        content:
          text/plain:
            schema:
              description: Undo or redo the last action
              type: string
              enum: [undo, redo]
      x-codegen-request-body-name: execute-action
      responses:
        '200':
          description: Action executed successfully. Body contains the description of what was undone or redone.
          content:
            text/plain:
              schema:
                type: string
                example: '{ Insert Layer }'
        '400':
          description: An invalid action was sent.
          content: {}
        '404':
          $ref: '#/components/responses/NotFound'
        '412':
          description: Nothing to undo or redo (stack is empty).
          content:
            text/plain:
              schema:
                type: string
                example: 'Nothing to undo'
  /composition/disconnect-all:
    post:
      tags:
      - composition
      summary: Disconnect all clips in the composition
      description: Any connected clip will be disconnected
      operationId: composition_disconnect_all
      responses:
        '204':
          description: OK
  /composition/effects/by-id/{effect-id}/set-display-name:
    parameters:
    - name: effect-id
      in: path
      description: The unique id of the effect to change the name for
      required: true
      schema:
        type: integer
        format: int64
    post:
      tags:
      - composition
      - effects
      summary: Change the display name of an effect
      description: Change the display name of the effect with the matching unique id
      operationId: effect_set_display_name_by_id
      requestBody:
        description: The new display name for the effect
        content:
          text/plain:
            schema:
              type: string
      x-codegen-request-body-name: effect-display-name
      responses:
        '204':
          description: OK
        '400':
          description: Invalid effect or preset specification
        '412':
          $ref: '#/components/responses/PreconditionFailed'
  /composition/effects/video/move:
    post:
      tags:
      - composition
      summary: Move an effect to the end of the composition
      description: Take an existing effect instance, and move it to the end of the composition
      operationId: move_effect_composition
      requestBody:
        description: The effect instance to move
        content:
          text/plain:
            schema:
              type: string
            examples:
              composition-effect:
                value: '/composition/effects/video/3'
              layer-effect:
                value: '/composition/layers/1/effects/video/2'
              layer-effect-by-id:
                value: '/composition/layers/by-id/1658311521181/effects/video/1'
              layer-group-effect:
                value: '/composition/layergroups/2/effects/video/1'
              layer-group-effect-by-id:
                value: '/composition/layergroups/by-id/1658311522986/effects/video/7'
              clip-effect:
                value: '/composition/layers/1/clips/5/effects/video/2'
              clip-effect-by-id:
                value: '/composition/clips/by-id/1658311744128/effects/video/5'
              effect-by-id:
                value: 'effects/by-id/1658311809911'
      x-codegen-request-body-name: effect-instantiation-uri
      responses:
        '204':
          description: OK
        '400':
          description: Invalid effect or preset specification
        '412':
          $ref: '#/components/responses/PreconditionFailed'
  /composition/effects/video/move/{offset}:
    parameters:
    - name: offset
      in: path
      description: The offset at which to insert the effect
      required: true
      schema:
        type: integer
        format: int64
    post:
      tags:
      - composition
      summary: Move an effect to the end of the composition
      description: Take an existing effect instance, and move it to the index inside the composition
      operationId: move_effect_composition_offset
      requestBody:
        description: The effect instance to move
        content:
          text/plain:
            schema:
              type: string
            examples:
              composition-effect:
                value: '/composition/effects/video/3'
              layer-effect:
                value: '/composition/layers/1/effects/video/2'
              layer-effect-by-id:
                value: '/composition/layers/by-id/1658311521181/effects/video/1'
              layer-group-effect:
                value: '/composition/layergroups/2/effects/video/1'
              layer-group-effect-by-id:
                value: '/composition/layergroups/by-id/1658311522986/effects/video/7'
              clip-effect:
                value: '/composition/layers/1/clips/5/effects/video/2'
              clip-effect-by-id:
                value: '/composition/clips/by-id/1658311744128/effects/video/5'
              effect-by-id:
                value: 'effects/by-id/1658311809911'
      x-codegen-request-body-name: effect-instantiation-uri
      responses:
        '204':
          description: OK
        '400':
          description: Invalid effect or preset specification
        '412':
          $ref: '#/components/responses/PreconditionFailed'
  /composition/effects/video/add:
    post:
      tags:
      - composition
      summary: Add an effect to the entire composition
      description: Add a global effect, which affects everything within the composition
      operationId: add_effect_composition
      requestBody:
        description: The effect to add to the composition
        content:
          text/plain:
            schema:
              type: string
            examples:
              blow:
                value: "effect:///video/Blow"
              blow-solid:
                value: "effect:///video/Blow/Solid"
      x-codegen-request-body-name: composition-add-effect
      responses:
        '204':
          description: OK
        '400':
          description: Invalid effect or preset specification
        '412':
          $ref: '#/components/responses/PreconditionFailed'
  /composition/effects/video/add/{offset}:
    parameters:
    - name: offset
      in: path
      description: The offset at which to insert the new effect
      required: true
      schema:
        type: integer
        format: int64
    post:
      tags:
      - composition
      summary: Add an effect to the entire composition
      description: Add a global effect, which affects everything within the composition
      operationId: add_composition_effect_offset
      requestBody:
        description: The effect to add to the composition
        content:
          text/plain:
            schema:
              type: string
            examples:
              blow:
                value: "effect:///video/Blow"
              blow-solid:
                value: "effect:///video/Blow/Solid"
      x-codegen-request-body-name: composition-add-effect-offset
      responses:
        '204':
          description: OK
        '400':
          description: Invalid effect or preset specification or incorrect offset
        '412':
          $ref: '#/components/responses/PreconditionFailed'
  /composition/effects/video/{offset}:
    parameters:
    - name: offset
      in: path
      description: The offset of the effect to remove
      required: true
      schema:
        type: integer
        format: int64
    delete:
      tags:
      - composition
      summary: Remove an effect from the entire composition
      description: Remove a global effect, which affects everything within the composition
      operationId: delete_composition_effect
      responses:
        '204':
          description: OK
        '404':
          description: No effect found at the given offset
        '412':
          $ref: '#/components/responses/PreconditionFailed'
  /composition/effects/video/{effect-offset}/set-display-name:
    parameters:
    - name: effect-offset
      in: path
      description: The offset of the video effect to rename
      required: true
      schema:
        type: integer
        format: int64
    post:
      tags:
      - composition
      - effects
      summary: Change the display name of a video effect on the composition
      description: Change the display name of the video effect at the given offset in the composition
      operationId: video_effect_set_display_name_composition
      requestBody:
        description: The new display name for the effect
        content:
          text/plain:
            schema:
              type: string
      x-codegen-request-body-name: effect-display-name
      responses:
        '204':
          description: OK
        '400':
          description: Invalid effect or preset specification
        '404':
          $ref: '#/components/responses/NotFound'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
  /composition/effects/audio/{effect-offset}/set-display-name:
    parameters:
    - name: effect-offset
      in: path
      description: The offset of the audio effect to rename
      required: true
      schema:
        type: integer
        format: int64
    post:
      tags:
      - composition
      - effects
      summary: Change the display name of an audio effect on the composition
      description: Change the display name of the audio effect at the given offset in the composition
      operationId: audio_effect_set_display_name_composition
      requestBody:
        description: The new display name for the effect
        content:
          text/plain:
            schema:
              type: string
      x-codegen-request-body-name: audio-effect-display-name
      responses:
        '204':
          description: OK
        '400':
          description: Invalid effect or preset specification
        '404':
          $ref: '#/components/responses/NotFound'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
  /composition/effects/audio/move:
    post:
      tags:
      - composition
      summary: Move an audio effect to the end of the composition
      description: Take an existing audio effect instance, and move it to the end of the composition
      operationId: move_audio_effect_composition
      requestBody:
        description: The audio effect instance to move
        content:
          text/plain:
            schema:
              type: string
            examples:
              composition-effect:
                value: '/composition/effects/audio/3'
              layer-effect:
                value: '/composition/layers/1/effects/audio/2'
              layer-effect-by-id:
                value: '/composition/layers/by-id/1658311521181/effects/audio/1'
              layer-group-effect:
