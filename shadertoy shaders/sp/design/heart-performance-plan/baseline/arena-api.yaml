          **Important:** All special characters must be percent-encoded. Spaces must be encoded as `%20` or `+` - this is a common source of errors.

          **Format rules:**
          - Use `file:///` prefix (three forward slashes)
          - Use forward slashes `/` as separators, even on Windows
          - Encode spaces as `%20` or `+`

          **File examples:**
          - `/Users/Resolume/file 1.mov` → `file:///Users/Resolume/file%201.mov`
          - `C:\Users\Resolume\file 1.mov` → `file:///C:/Users/Resolume/file%201.mov`

          **For sources:** Use `source:///video/<source name>` format, optionally with a preset ID: `source:///video/<source name>/<preset id>`
