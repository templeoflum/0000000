<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Heart · Session progress</title>
<style>
:root{color-scheme:dark;--ink:#e5e9e7;--muted:#a4b1ab;--line:#35433c;--green:#a9dfb6;--amber:#edc688}*{box-sizing:border-box}body{margin:0;background:#131a17;color:var(--ink);font:14px/1.5 system-ui,sans-serif}main{max-width:1050px;margin:auto;padding:30px 24px 60px}header{border-bottom:1px solid var(--line);padding-bottom:20px}h1{font-size:26px;font-weight:550;margin:3px 0 8px}h2{font-size:16px;font-weight:600;margin:25px 0 10px}p{margin:5px 0;color:var(--muted)}.eyebrow{font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:var(--green)}.counts{display:flex;gap:22px;flex-wrap:wrap;padding:16px 0}.counts strong{font-size:22px;font-weight:500;color:var(--green);margin-right:6px}.counts span{color:var(--muted)}progress{appearance:none;width:100%;height:5px;border:0;background:#2c3932}progress::-webkit-progress-bar{background:#2c3932}progress::-webkit-progress-value{background:var(--green)}.lanes{display:grid;grid-template-columns:1fr 1fr;gap:24px}.item{padding:12px 0;border-top:1px solid var(--line)}.line{display:flex;align-items:start;gap:8px}.line strong{font-weight:550;flex:1}.mark{color:var(--green);width:17px}.status{font-size:11px;color:var(--amber);white-space:nowrap}.item p{font-size:13px;margin:5px 0 0 25px}.status.done{color:var(--green)}ol,ul{padding-left:22px;color:var(--muted)}li{padding:4px 0}.history li strong{color:var(--ink);font-weight:500}footer{padding-top:25px;font-size:12px;color:var(--muted)}#connection{color:var(--amber)}@media(max-width:640px){main{padding:22px 16px}.lanes{grid-template-columns:1fr;gap:0}.status{max-width:100px;white-space:normal;text-align:right}}
</style>
<main><header><div class="eyebrow">Heart / build session</div><h1>Progress & checklist</h1><p id="focus">Loading session status…</p><p id="connection"></p></header><div class="counts" id="counts"></div><progress id="bar" value="0" max="1" aria-label="Verified session work"></progress><div class="lanes"><section><h2>Session checklist</h2><div id="tasks"></div></section><section><h2>Where we came from</h2><ol class="history" id="history"></ol><h2>What comes next</h2><ol id="next"></ol><h2>Saved for your input</h2><ul id="choices"></ul></section></div><footer id="stamp"></footer></main>
<script>
const $=id=>document.getElementById(id);let last='';
function text(tag,value){const e=document.createElement(tag);e.textContent=value;return e}
function render(s){$('focus').textContent=s.focus;const done=s.tasks.filter(t=>t.status==='Verified').length,working=s.tasks.filter(t=>t.status==='In progress'||t.status==='Built · checking').length;$('counts').replaceChildren(...[[done,'verified'],[working,'in progress'],[s.tasks.length-done-working,'ahead']].map(([n,label])=>{const e=text('span','');e.append(text('strong',n),document.createTextNode(label));return e}));$('bar').max=s.tasks.length;$('bar').value=done;$('tasks').replaceChildren(...s.tasks.map(t=>{const e=text('article','');e.className='item';const line=text('div','');line.className='line';const mark=text('span',t.status==='Verified'?'✓':t.status==='Next'?'○':'◐');mark.className='mark';const status=text('span',t.status);status.className='status'+(t.status==='Verified'?' done':'');line.append(mark,text('strong',t.title),status);e.append(line,text('p',t.detail));return e}));for(const id of ['history','next','choices'])$(id).replaceChildren(...s[id].map(v=>text('li',v)));$('stamp').textContent='Updated '+new Date(s.updated).toLocaleTimeString()+' · Refreshes automatically every 3 seconds. “Verified” means the stated check passed; output and performer acceptance are recorded separately.'}
async function refresh(){try{const response=await fetch('status.json?t='+Date.now(),{cache:'no-store'});if(!response.ok)throw Error();const raw=await response.text();if(raw!==last){render(JSON.parse(raw));last=raw}$('connection').textContent=''}catch{$('connection').textContent='Updates temporarily unavailable; showing the last saved status.'}}refresh();setInterval(refresh,3000);
</script></html>
